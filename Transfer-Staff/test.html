<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์กลางระบบโอนย้ายพนักงาน | Tokai</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ตัวแปรสีหลัก (เหมือนกับระบบเดิม) --- */
        :root {
            --bg: #eef2f7;
            --surface: #ffffff;
            --card: #f5f8fc;
            --border: #d0daea;
            --focus: #2563eb;
            --accent: #1d4ed8;
            --accent-lt: #eff6ff;
            --header: #1e3a8a;
            --t1: #0f172a;
            --t2: #475569;
            --t3: #94a3b8;
            --r: 12px;
            --rs: 8px;
            --sh: 0 4px 16px rgba(30,58,138,0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg);
            color: var(--t1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* --- การ์ดหลัก --- */
        .container {
            max-width: 880px;
            width: 100%;
            background: var(--surface);
            border-radius: var(--r);
            box-shadow: var(--sh);
            border: 1px solid var(--border);
            overflow: hidden;
            padding: 32px 36px 40px;
            transition: all 0.2s;
        }

        /* --- หัวข้อ --- */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--header);
            color: #fff;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(30,58,138,0.25);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--t1);
            letter-spacing: 0.5px;
        }

        .header .sub {
            font-size: 16px;
            color: var(--t2);
            margin-top: 6px;
            font-weight: 400;
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            margin: 0 0 32px 0;
            width: 100%;
        }

        /* --- กริดปุ่ม --- */
        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .card-button {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--r);
            padding: 28px 24px;
            text-align: center;
            text-decoration: none;
            color: var(--t1);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .card-button:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(30,58,138,0.12);
            background: var(--surface);
        }

        .card-button:active {
            transform: scale(0.97);
        }

        .card-button .icon {
            font-size: 40px;
            line-height: 1;
        }

        .card-button .label {
            font-size: 18px;
            font-weight: 700;
        }

        .card-button .desc {
            font-size: 14px;
            color: var(--t3);
            line-height: 1.5;
        }

        .card-button .badge {
            font-size: 12px;
            background: var(--accent-lt);
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #bfdbfe;
            font-weight: 600;
            margin-top: 4px;
        }

        /* --- ปุ่มพิเศษ (ต่างสี) --- */
        .card-button.primary {
            background: var(--accent-lt);
            border-color: #bfdbfe;
        }

        .card-button.primary:hover {
            background: #dbeafe;
            border-color: var(--accent);
        }

        .card-button.secondary {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .card-button.secondary:hover {
            background: #dcfce7;
            border-color: #4ade80;
        }

        /* --- ฟุตเตอร์ข้อมูล --- */
        .info-box {
            background: var(--card);
            border-radius: var(--rs);
            padding: 18px 22px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .info-box .version {
            font-size: 13px;
            color: var(--t3);
        }

        .info-box .version span {
            font-weight: 600;
            color: var(--t2);
        }

        .info-box .date {
            font-size: 13px;
            color: var(--t2);
            background: var(--surface);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            .container {
                padding: 24px 18px 28px;
            }

            .grid-buttons {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .header h1 {
                font-size: 22px;
            }

            .card-button {
                padding: 22px 18px;
            }

            .info-box {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }

        /* --- ปุ่มทดสอบระบบ (เพิ่มเติม) --- */
        .test-section {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .test-btn {
            background: transparent;
            border: 1px dashed var(--border);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            color: var(--t3);
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .test-btn:hover {
            border-color: var(--t2);
            color: var(--t2);
            background: var(--card);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div class="logo-icon">🏢</div>
            <h1>🚀 ศูนย์กลางระบบโอนย้ายพนักงาน</h1>
            <div class="sub">เลือกแผนกต้นทางที่ต้องการดำเนินการ</div>
        </div>

        <div class="divider"></div>

        <!-- GRID BUTTONS -->
        <div class="grid-buttons">

            <!-- ปุ่มที่ 1: แผนกต้นทาง A -->
            <a href="https://script.google.com/macros/s/AKfycby-ThuG0Ew0LUhZOu013LEk08dY6emFtAnNhk8F0a4p_PSutHjKX-0g0mp9xArExNah/exec?authuser=0"
               target="_blank"
               class="card-button primary">
                <div class="icon">📂</div>
                <div class="label">แผนกต้นทาง A</div>
                <div class="desc">ระบบบันทึกและอนุมัติ<br>สำหรับแผนกผลิตชิ้นส่วน</div>
                <div class="badge">🔗 เปิดใช้งาน</div>
            </a>

            <!-- ปุ่มที่ 2: แผนกต้นทาง B -->
            <a href="https://script.google.com/macros/s/AKfycbwGzdqRCG_1sTyGiOCzy7P8HEsCm11uhBKhUidoD30-qFazwPsgxXwZK7mkviV60H3v/exec?authuser=0"
               target="_blank"
               class="card-button secondary">
                <div class="icon">📁</div>
                <div class="label">แผนกต้นทาง B</div>
                <div class="desc">ระบบบันทึกและอนุมัติ<br>สำหรับแผนกผสมยาง</div>
                <div class="badge">🔗 เปิดใช้งาน</div>
            </a>

        </div>

        <!-- INFO FOOTER -->
        <div class="info-box">
            <div class="version">
                🧪 <span>เวอร์ชันทดสอบ</span> · รองรับการเชื่อมต่อ 2 ระบบ
            </div>
            <div class="date" id="displayDate">—</div>
        </div>

        <!-- TEST BUTTONS (เพิ่มเติม) -->
        <div class="test-section">
            <button class="test-btn" onclick="window.location.reload();">🔄 รีเฟรชหน้า</button>
            <button class="test-btn" onclick="showAlert();">📋 ตรวจสอบสถานะ</button>
        </div>

    </div>

    <script>
        // แสดงวันที่ปัจจุบัน
        (function() {
            const now = new Date();
            const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
            const mons = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            const dateStr = 'วัน' + days[now.getDay()] + ' ' + now.getDate() + ' ' + mons[now.getMonth()] + ' ' + (now.getFullYear() + 543);
            document.getElementById('displayDate').textContent = '📅 ' + dateStr;
        })();

        // ฟังก์ชันจำลองตรวจสอบ
        function showAlert() {
            alert('✅ ระบบพร้อมใช้งาน\n\n' +
                  '🔹 แผนกต้นทาง A : ' + 'https://script.google.com/macros/s/AKfycby-ThuG0Ew0LUhZOu013LEk08dY6emFtAnNhk8F0a4p_PSutHjKX-0g0mp9xArExNah/exec?authuser=0' + '\n' +
                  '🔹 แผนกต้นทาง B : ' + 'https://script.google.com/macros/s/AKfycbwGzdqRCG_1sTyGiOCzy7P8HEsCm11uhBKhUidoD30-qFazwPsgxXwZK7mkviV60H3v/exec?authuser=0');
        }
    </script>

</body>
</html>
