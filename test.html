<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ - OT Time Tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-0:#08070a;
  --bg-1:#0f0d11;
  --surface:#141217;
  --surface-2:#1a171d;
  --border:#2a2530;
  --border-soft:#211d24;

  --red:#e11d2e;
  --red-bright:#ff3b48;
  --red-dim:#7a1420;
  --red-glow:rgba(225,29,46,.35);

  --t1:#f5f4f6;
  --t2:#a9a3ae;
  --t3:#655f6c;

  --ok:#22c55e;
  --ok-lt:rgba(34,197,94,.1);
  --err:#ff4d5e;
  --err-lt:rgba(255,77,94,.1);

  --rs:10px;
}

body {
  font-family:'Sarabun', sans-serif;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(225,29,46,.16), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(122,20,32,.12), transparent 55%),
    var(--bg-0);
  position:relative;
  overflow-x:hidden;
}

/* faint diagonal hazard-style texture, very subtle, nods to "overtime / after hours" */
body::before {
  content:"";
  position:fixed; inset:0;
  background-image: repeating-linear-gradient(135deg, rgba(225,29,46,.035) 0px, rgba(225,29,46,.035) 1px, transparent 1px, transparent 26px);
  pointer-events:none;
}

.card {
  width:100%; max-width:400px;
  background:linear-gradient(180deg, var(--surface), var(--bg-1));
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:
    0 0 0 1px rgba(225,29,46,.06),
    0 20px 60px rgba(0,0,0,.55),
    0 4px 18px rgba(225,29,46,.08);
  overflow:hidden;
  position:relative;
  z-index:1;
}

/* signature: a thin red accent bar at the very top, like a status/live indicator */
.card::before {
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg, var(--red-dim), var(--red-bright) 50%, var(--red-dim));
}

.head {
  padding:32px 24px 24px;
  text-align:center;
  border-bottom:1px solid var(--border-soft);
  background:
    radial-gradient(ellipse 260px 120px at 50% 0%, rgba(225,29,46,.14), transparent 70%);
}

.logo {
  width:84px; height:84px;
  border-radius:18px;
  margin:0 auto 14px;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface-2);
  border:1px solid var(--border);
  box-shadow:0 0 0 4px rgba(225,29,46,.06), 0 6px 18px rgba(225,29,46,.15);
  overflow:hidden;
  position:relative;
}
.logo img {
  width:100%; height:100%;
  object-fit:cover;
  transform:scale(1.15);
  display:block;
}
.logo .fallback {
  font-size:20px; font-weight:800; color:var(--red-bright);
  letter-spacing:.5px;
  display:none;
}
.logo.no-image .fallback { display:block; }
.logo.no-image img { display:none; }

.head h1 {
  font-size:18.5px; font-weight:700; color:var(--t1);
  letter-spacing:.2px;
}
.head p {
  font-size:12.5px; color:var(--t2); margin-top:6px;
  letter-spacing:.3px;
}

.body { padding:26px 24px 24px; }

.field { margin-bottom:16px; }
.field label {
  display:block; font-size:11.5px; font-weight:700; color:var(--t2);
  margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;
}

input {
  width:100%; padding:12px 14px;
  background:var(--surface-2);
  border:1.5px solid var(--border);
  border-radius:var(--rs);
  font-size:15px; font-family:inherit; color:var(--t1);
  outline:none;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
input::placeholder { color:var(--t3); }
input:focus {
  border-color:var(--red);
  background:var(--surface);
  box-shadow:0 0 0 3px var(--red-glow);
}

button {
  width:100%; margin-top:6px; padding:13px;
  background:linear-gradient(180deg, var(--red-bright), var(--red));
  color:#fff; border:none; border-radius:var(--rs);
  font-size:15px; font-weight:700; letter-spacing:.3px;
  cursor:pointer; font-family:inherit;
  box-shadow:0 6px 18px rgba(225,29,46,.35), inset 0 1px 0 rgba(255,255,255,.15);
  transition:filter .15s, transform .1s, box-shadow .15s;
}
button:hover:not(:disabled) {
  filter:brightness(1.08);
  box-shadow:0 8px 22px rgba(225,29,46,.5), inset 0 1px 0 rgba(255,255,255,.15);
}
button:active:not(:disabled) { transform:translateY(1px); }
button:disabled { opacity:.6; cursor:default; }

.msg {
  display:none; margin-bottom:14px; padding:10px 13px;
  border-radius:var(--rs); font-size:13.5px; font-weight:600;
}
.msg.show { display:block; }
.msg.err { background:var(--err-lt); color:var(--err); border:1px solid rgba(255,77,94,.3); }
.msg.ok  { background:var(--ok-lt);  color:var(--ok);  border:1px solid rgba(34,197,94,.3); }

.foot {
  padding:14px; text-align:center; color:var(--t3); font-size:11.5px;
  border-top:1px solid var(--border-soft);
  background:var(--bg-1);
  letter-spacing:.2px;
}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="logo" id="logoBox">
      <img id="logoImg" alt="โลโก้บริษัท"
           src="https://drive.google.com/thumbnail?id=1g6UjqdgR1SZ8WWHI5pFA5fkeIRRTJtfr&sz=w200">
      <span class="fallback">OT</span>
    </div>
    <h1>เข้าระบบการลงเวลาขอโอที</h1>
    <p>สำหรับพนักงานธุรการและผู้จัดการ</p>
  </div>
  <div class="body">
    <form id="f" autocomplete="on">
      <div class="field">
        <label>รหัสผู้ใช้งาน</label>
        <input type="text" id="mcode" name="mcode" placeholder="รหัสพนักงาน" autocomplete="username">
      </div>
      <div class="field">
        <label>รหัสผ่าน</label>
        <input type="password" id="mpass" name="mpass" placeholder="วันเริ่มงาน" autocomplete="current-password">
      </div>
      <div id="msg" class="msg"></div>
      <button type="submit" id="btn">เข้าสู่ระบบ</button>
    </form>
  </div>
  <div class="foot">ระบบบันทึกเวลาทำงานล่วงเวลา © 2026 | พัฒนาโดย Sarawut.C</div>
</div>

<script>
(function(){
  "use strict";

  // if the Drive image fails to load (permissions, hotlink block, etc.), fall back to text mark
  const logoBox = document.getElementById('logoBox');
  const logoImg = document.getElementById('logoImg');
  logoImg.addEventListener('error', function(){
    logoBox.classList.add('no-image');
  });

  const SUPABASE_URL = 'https://gjmgzjsbgqaaxlpbyykt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqbWd6anNiZ3FhYXhscGJ5eWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjQyMjUsImV4cCI6MjEwMTYwMDIyNX0.wacphD2FPgaaETYc0N-Ze4q9gPr2BaO0MKNo9RBnlm0';
  const HOME_URL = 'index.html';
  const sbLogin = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('f');
  const codeEl = document.getElementById('mcode');
  const passEl = document.getElementById('mpass');
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('btn');

  function showMsg(type, text){
    msgEl.className = 'msg show ' + type;
    msgEl.textContent = text;
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const code = codeEl.value.trim();
    const pass = passEl.value.trim();
    if (!code || !pass){ showMsg('err','กรุณากรอกข้อมูลให้ครบ'); return; }

    btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
    msgEl.className = 'msg';

    try {
      const { data, error } = await sbLogin.rpc('manager_login', { p_code: code, p_pass: pass });
      if (error){
        showMsg('err','เกิดข้อผิดพลาดในการเชื่อมต่อ');
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
        return;
      }
      if (data.status === 'success'){
        localStorage.setItem('mgrToken', code);
        localStorage.setItem('mgrDept', data.department || '');
        localStorage.setItem('mgrName', data.name || code);
        localStorage.setItem('mgrExpire', Date.now() + 1000*60*30);
        showMsg('ok','เข้าสู่ระบบสำเร็จ กำลังเข้าสู่หน้าหลัก...');
        setTimeout(function(){ window.location.href = HOME_URL; }, 400);
      } else if (data.status === 'denied'){
        showMsg('err', data.message || 'บัญชีนี้ถูกระงับการใช้งาน');
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      } else {
        showMsg('err', data.message || 'รหัสผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง');
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      }
    } catch (err){
      showMsg('err','เกิดข้อผิดพลาด: ' + err.message);
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    }
  });
})();
</script>
</body>
</html>
