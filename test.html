<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายงานการย้ายพนักงาน – TOKAISOLIDTIRE</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:       #1156A8;
      --brand-dark:  #0A3E7A;
      --brand-mid:   #185FA5;
      --brand-light: #E6F1FB;
      --brand-pale:  #F0F6FD;
      --accent:      #378ADD;
      --border:      #C8D9EE;
      --success:     #3B6D11;
      --success-bg:  #EAF3DE;
      --amber:       #BA7517;
      --amber-bg:    #FAEEDA;
      --ink:         #0F1C2E;
      --mid:         #5A6E88;
      --mist:        #8BA3BF;
      --snow:        #F4F8FC;
      --white:       #FFFFFF;
      --r:           7px;
      --shadow:      0 1px 8px rgba(10,30,60,.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', 'Tahoma', 'Leelawadee UI', sans-serif;
      background: var(--snow);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--brand-dark);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--brand-mid);
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .badge-tst {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      padding: 3px 9px;
      border-radius: 4px;
    }
    .brand-title { font-size: 14px; font-weight: 600; color: #D4E6F7; letter-spacing: .04em; }
    .brand-sub { font-size: 12px; color: #85B7EB; margin-left: 8px; font-weight: 400; }
    .header-time { font-size: 12px; color: #6B9FCE; }

    /* ── LAYOUT ── */
    .page { max-width: 1140px; margin: 0 auto; padding: 24px 22px 64px; }

    /* ── FILTER CARD ── */
    .filter-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 18px 22px 20px;
      margin-bottom: 20px;
    }
    .filter-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--mist);
      margin-bottom: 14px;
    }
    .filter-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .fg { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
    .fg label { font-size: 12px; font-weight: 500; color: var(--mid); }

    /* ── VIEW TABS ── */
    .view-tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }
    .view-tabs button {
      flex: 1;
      min-width: 58px;
      height: 36px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--mid);
      cursor: pointer;
      border-right: 1px solid var(--border);
      padding: 0 10px;
      transition: background .12s, color .12s;
    }
    .view-tabs button:last-child { border-right: none; }
    .view-tabs button.active { background: var(--brand); color: #fff; }
    .view-tabs button:hover:not(.active) { background: var(--brand-pale); color: var(--brand); }

    /* ── FORM CONTROLS ── */
    select, input[type="date"], input[type="text"], input[type="month"] {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--white);
      outline: none;
      width: 100%;
      transition: border .15s;
    }
    select:focus, input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(17,86,168,.10);
    }

    /* ── BUTTONS ── */
    .btn-row { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .btn {
      height: 36px;
      padding: 0 16px;
      border: none;
      border-radius: var(--r);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-green   { background: var(--success); color: #fff; }
    .btn-slate   { background: #2D5077; color: #fff; }

    /* ── STATS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 18px 16px;
      box-shadow: var(--shadow);
    }
    .stat-card.accent { border-top: 3px solid var(--brand); }
    .stat-card.amber  { border-top: 3px solid var(--amber); }
    .stat-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 600; line-height: 1; color: var(--ink); }
    .stat-card.accent .stat-value { color: var(--brand); }
    .stat-card.amber  .stat-value { color: var(--amber); }
    .stat-bar { height: 3px; border-radius: 2px; margin-top: 10px; background: var(--brand-light); overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 2px; background: var(--brand); transition: width .5s; }
    .stat-range-val { font-size: 13px; font-weight: 400; color: var(--mid); padding-top: 4px; }

    /* ── TABLE CARD ── */
    .table-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--brand-pale);
    }
    .table-topbar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-dark);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .table-topbar-title svg { color: var(--brand); flex-shrink: 0; }
    .count-pill {
      background: var(--brand-light);
      color: var(--brand-dark);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 11px;
      border-radius: 20px;
      border: 1px solid var(--brand-mid);
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { background: var(--brand-light); border-bottom: 2px solid var(--border); }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--brand-dark);
      white-space: nowrap;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #EBF2FA;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--brand-pale); }
    .mono { font-size: 12px; color: var(--mist); font-family: 'Courier New', monospace; }
    .pill {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .pill-from { background: var(--brand-light); color: var(--brand-dark); border: 1px solid #B5D4F4; }
    .pill-to   { background: var(--success-bg); color: #085041; border: 1px solid #C0DD97; }

    /* ── STATES ── */
    .state-box { text-align: center; padding: 56px 20px; color: var(--mid); }
    .state-icon { font-size: 36px; margin-bottom: 12px; }
    .state-msg { font-size: 14px; color: var(--mid); }
    .spin {
      width: 28px; height: 28px;
      border: 2.5px solid var(--brand-light);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PRINT ── */
    @media print {
      header, .filter-card, .btn-row, .stats-grid { display: none !important; }
      body { background: white; }
      .table-card { box-shadow: none; border: 1px solid #ccc; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 760px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand-wrap">
    <span class="badge-tst">TST</span>
    <span class="brand-title">TOKAISOLIDTIRE</span>
    <span class="brand-sub">รายงานการย้ายพนักงาน</span>
  </div>
  <span class="header-time" id="lastUpdated"></span>
</header>

<div class="page">

  <!-- FILTER -->
  <div class="filter-card">
    <div class="filter-label">ตัวกรองข้อมูล</div>
    <div class="filter-row">

      <div class="fg" style="flex:2; min-width:260px; flex-direction:column;">
        <label>โหมดดูข้อมูล</label>
        <div class="view-tabs" id="viewTabs">
          <button class="active" onclick="setView('dept',this)">แผนก</button>
          <button onclick="setView('day',this)">รายวัน</button>
          <button onclick="setView('week',this)">รายสัปดาห์</button>
          <button onclick="setView('month',this)">รายเดือน</button>
          <button onclick="setView('year',this)">รายปี</button>
        </div>
      </div>

      <div id="dynFilters" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;flex:3;min-width:180px;"></div>

      <div class="fg" style="min-width:150px;">
        <label>แผนก</label>
        <select id="deptFilter"><option value="">ทั้งหมด</option></select>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="loadData()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          ค้นหา
        </button>
        <button class="btn btn-green" onclick="exportCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV
        </button>
        <button class="btn btn-slate" onclick="exportPDF()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF
        </button>
      </div>

    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card accent">
      <div class="stat-label">รายการทั้งหมด</div>
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="barTotal" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">พนักงานทั้งหมด</div>
      <div class="stat-value" id="statEmp">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="barEmp" style="width:0%;background:#378ADD"></div></div>
    </div>
    <div class="stat-card amber">
      <div class="stat-label">จำนวนแผนก</div>
      <div class="stat-value" id="statDept">—</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="background:var(--amber)" id="barDept"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ช่วงข้อมูล</div>
      <div class="stat-range-val" id="statRange">—</div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <div class="table-topbar">
      <span class="table-topbar-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
        ข้อมูลการย้ายพนักงาน
      </span>
      <span class="count-pill" id="tableCount"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td colspan="8">
            <div class="state-box">
              <div class="state-icon">📋</div>
              <div class="state-msg">กดปุ่ม "ค้นหา" เพื่อโหลดข้อมูล</div>
            </div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzRm1_KG0CWBaXFEKd63EzRxAy3CR5Vss-hJyArqQbTdyVsCgxACOT_hwKtCH9VLxg/exec';
  let currentView = 'dept';
  let allData = [];
  let departments = [];

  function setView(mode, btn) {
    currentView = mode;
    document.querySelectorAll('#viewTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDynFilters();
  }

  function renderDynFilters() {
    const c = document.getElementById('dynFilters');
    c.innerHTML = '';
    const today = new Date().toISOString().split('T')[0];
    const yr = new Date().getFullYear();
    const mo = String(new Date().getMonth() + 1).padStart(2, '0');

    if (currentView === 'day') {
      c.innerHTML = `<div class="fg"><label>วันที่</label><input type="date" id="filterDate" value="${today}" /></div>`;
    } else if (currentView === 'week') {
      const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const mon = d.toISOString().split('T')[0];
      c.innerHTML = `<div class="fg"><label>วันเริ่มต้น (จันทร์)</label><input type="date" id="filterWeekStart" value="${mon}" /></div>`;
    } else if (currentView === 'month') {
      c.innerHTML = `<div class="fg"><label>เดือน</label><input type="month" id="filterMonth" value="${yr}-${mo}" /></div>`;
    } else if (currentView === 'year') {
      const opts = Array.from({length: 6}, (_, i) => yr - i)
        .map(y => `<option value="${y}"${y === yr ? ' selected' : ''}>${y}</option>`).join('');
      c.innerHTML = `<div class="fg"><label>ปี</label><select id="filterYear">${opts}</select></div>`;
    }
  }

  function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

  function buildParams() {
    const p = new URLSearchParams({ action: 'getData', view: currentView });
    if (currentView === 'day')   p.set('date', val('filterDate'));
    if (currentView === 'week')  p.set('weekStart', val('filterWeekStart'));
    if (currentView === 'month') p.set('month', val('filterMonth'));
    if (currentView === 'year')  p.set('year', val('filterYear'));
    return p.toString();
  }

  function loadData() {
    setLoading();
    fetch(`${SCRIPT_URL}?${buildParams()}`)
      .then(r => r.json())
      .then(data => {
        allData = data.records || [];
        departments = data.departments || [];
        populateDept();
        applyDept();
        updateStats(data);
        updateTime();
      })
      .catch(() => showError('ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบการตั้งค่า'));
  }

  function populateDept() {
    const sel = document.getElementById('deptFilter');
    const cur = sel.value;
    sel.innerHTML = '<option value="">ทั้งหมด</option>';
    departments.forEach(d => { sel.innerHTML += `<option value="${d}">${d}</option>`; });
    if (cur) sel.value = cur;
  }

  function applyDept() {
    const dept = document.getElementById('deptFilter').value;
    const rows = dept ? allData.filter(r => r.deptTo === dept || r.deptFrom === dept) : allData;
    renderTable(rows);
  }

  function renderTable(rows) {
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    document.getElementById('tableCount').textContent = `${rows.length} รายการ`;

    head.innerHTML = `<tr>
      <th>#</th><th>ลำดับ</th><th>วันที่</th><th>รหัส</th><th>ชื่อ-สกุล</th>
      <th>ต้นทาง</th><th>ปลายทาง</th><th>หมายเหตุ</th>
    </tr>`;

    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="8"><div class="state-box">
        <div class="state-icon">🔍</div>
        <div class="state-msg">ไม่พบข้อมูลในช่วงที่เลือก</div>
      </div></td></tr>`;
      return;
    }

    body.innerHTML = rows.map((r, i) => `
      <tr>
        <td class="mono">${i + 1}</td>
        <td class="mono">${r.seq || ''}</td>
        <td style="white-space:nowrap;font-size:12px;color:#5A6E88">${formatDate(r.date)}</td>
        <td class="mono">${r.empId || ''}</td>
        <td style="font-weight:600">${r.name || ''}</td>
        <td><span class="pill pill-from">${r.deptFrom || ''}</span></td>
        <td><span class="pill pill-to">${r.deptTo || ''}</span></td>
        <td style="color:#8BA3BF;font-size:12px">${r.note || ''}</td>
      </tr>`).join('');
  }

  function updateStats(data) {
    const total = (data.records || []).length;
    const empSet = new Set((data.records || []).map(r => r.empId).filter(Boolean));
    const deptN = (data.departments || []).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statEmp').textContent = empSet.size;
    document.getElementById('statDept').textContent = deptN;
    document.getElementById('statRange').textContent = data.range || '—';

    document.getElementById('barTotal').style.width = Math.min(total, 100) + '%';
    document.getElementById('barEmp').style.width = Math.min(empSet.size * 2, 100) + '%';
    document.getElementById('barDept').style.width = Math.min(deptN * 10, 100) + '%';
  }

  function setLoading() {
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="8"><div class="state-box">
      <div class="spin"></div>
      <div class="state-msg">กำลังโหลดข้อมูล...</div>
    </div></td></tr>`;
  }

  function showError(msg) {
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="8"><div class="state-box">
      <div class="state-icon">⚠️</div>
      <div class="state-msg">${msg}</div>
    </div></td></tr>`;
  }

  function exportCSV() {
    const dept = document.getElementById('deptFilter').value;
    const rows = dept ? allData.filter(r => r.deptTo === dept || r.deptFrom === dept) : allData;
    if (!rows.length) { alert('ไม่มีข้อมูลสำหรับ Export'); return; }

    const headers = ['ลำดับ', 'วันที่', 'รหัสพนักงาน', 'ชื่อ', 'แผนกปลายทาง', 'แผนกต้นทาง', 'หมายเหตุ'];
    const lines = [headers.join(',')];
    rows.forEach(r => {
      lines.push([r.seq, r.date, r.empId, r.name, r.deptTo, r.deptFrom, r.note || '']
        .map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
    });

    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `TST_Report_${currentView}_${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportPDF() { window.print(); }

  function formatDate(d) {
    if (!d) return '';
    try { return new Date(d).toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
    catch { return d; }
  }

  function updateTime() {
    document.getElementById('lastUpdated').textContent = 'อัปเดต: ' + new Date().toLocaleString('th-TH');
  }

  renderDynFilters();
</script>
</body>
</html>
