<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายงานการย้ายพนักงาน – TOKAISOLIDTIRE</title>

  <style>
    :root {
      --black:    #0F1117;
      --ink:      #1C2130;
      --steel:    #2E3A52;
      --mid:      #6B7A99;
      --mist:     #B8C0D0;
      --silver:   #DDE2EC;
      --snow:     #F4F6FA;
      --white:    #FFFFFF;
      --accent:   #C8102E;   /* Tokai red */
      --accent2:  #F0A500;   /* amber highlight */
      --success:  #1A8A5A;
      --radius:   6px;
      --shadow:   0 2px 12px rgba(15,17,23,.10);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', 'Tahoma', 'Leelawadee UI', 'Arial', sans-serif;
      background: var(--snow);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── TOP BAR ── */
    header {
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      background: var(--accent);
      color: var(--white);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      padding: 3px 9px;
      border-radius: 3px;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--silver);
    }
    .brand-sub {
      font-size: 12px;
      color: var(--mid);
      margin-left: 4px;
    }
    #lastUpdated {
      font-size: 12px;
      color: var(--mid);
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── LAYOUT ── */
    .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

    /* ── FILTER BAR ── */
    .filter-card {
      background: var(--white);
      border: 1px solid var(--silver);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .filter-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .10em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 16px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 160px;
    }
    .filter-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--steel);
    }
    select, input[type="date"], input[type="text"] {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--silver);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--white);
      outline: none;
      transition: border .15s;
    }
    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,16,46,.10);
    }

    /* ── VIEW MODE TABS ── */
    .view-tabs {
      display: flex;
      gap: 0;
      background: var(--snow);
      border: 1px solid var(--silver);
      border-radius: var(--radius);
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-tabs button {
      flex: 1;
      min-width: 72px;
      height: 38px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--mid);
      cursor: pointer;
      transition: background .12s, color .12s;
      border-right: 1px solid var(--silver);
      padding: 0 14px;
    }
    .view-tabs button:last-child { border-right: none; }
    .view-tabs button.active {
      background: var(--accent);
      color: var(--white);
    }
    .view-tabs button:hover:not(.active) {
      background: var(--silver);
      color: var(--ink);
    }

    /* ── ACTION BUTTONS ── */
    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .btn {
      height: 38px;
      padding: 0 18px;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-search {
      background: var(--accent);
      color: var(--white);
    }
    .btn-csv {
      background: var(--success);
      color: var(--white);
    }
    .btn-pdf {
      background: var(--steel);
      color: var(--white);
    }
    .btn:hover { opacity: .88; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--silver);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 26px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1;
    }
    .stat-card.accent-card .stat-value { color: var(--accent); }
    .stat-card.amber-card .stat-value  { color: var(--accent2); }

    /* ── TABLE ── */
    .table-card {
      background: var(--white);
      border: 1px solid var(--silver);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .table-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--silver);
    }
    .table-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .table-count {
      font-size: 12px;
      color: var(--mid);
      font-family: 'IBM Plex Mono', monospace;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead tr {
      background: var(--snow);
      border-bottom: 2px solid var(--silver);
    }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--mid);
      white-space: nowrap;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--silver);
      color: var(--ink);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--snow); }
    .badge-dept {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #EAF0FB;
      color: var(--steel);
    }
    .mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--mid); }

    /* ── LOADING / EMPTY ── */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--mid);
    }
    .state-icon { font-size: 40px; margin-bottom: 12px; }
    .state-msg { font-size: 14px; }
    .loading-spin {
      width: 32px; height: 32px;
      border: 3px solid var(--silver);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── WATERMARK PDF (print only) ── */
    @media print {
      header, .filter-card, .btn-row, .stats-row { display: none !important; }
      body { background: white; }
      .table-card { box-shadow: none; border: 1px solid #ccc; }
      .watermark-overlay { display: block !important; }
    }
    .watermark-overlay {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .wm-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 80px;
      font-weight: 700;
      color: rgba(200,16,46,.10);
      white-space: nowrap;
      letter-spacing: .1em;
      user-select: none;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .filter-row { flex-direction: column; }
      .view-tabs { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div class="watermark-overlay">
  <div class="wm-text">TOKAISOLIDTIRE</div>
</div>

<header>
  <div class="brand">
    <span class="brand-badge">TST</span>
    <span class="brand-name">TOKAISOLIDTIRE</span>
    <span class="brand-sub">รายงานการย้ายพนักงาน</span>
  </div>
  <span id="lastUpdated">—</span>
</header>

<div class="page">

  <!-- FILTER CARD -->
  <div class="filter-card">
    <div class="filter-title">ตัวกรองข้อมูล</div>
    <div class="filter-row">

      <!-- View mode -->
      <div class="filter-group" style="flex:2; min-width:280px;">
        <label>โหมดดูข้อมูล</label>
        <div class="view-tabs" id="viewTabs">
          <button class="active" onclick="setView('dept',this)">แผนก</button>
          <button onclick="setView('day',this)">รายวัน</button>
          <button onclick="setView('week',this)">รายสัปดาห์</button>
          <button onclick="setView('month',this)">รายเดือน</button>
          <button onclick="setView('year',this)">รายปี</button>
        </div>
      </div>

      <!-- Dynamic filters injected here -->
      <div id="dynamicFilters" class="filter-group" style="flex:3; min-width:200px; flex-direction:row; flex-wrap:wrap; gap:14px; align-items:flex-end;"></div>

      <!-- Dept filter -->
      <div class="filter-group" style="min-width:160px;" id="deptFilterGroup">
        <label>แผนก</label>
        <select id="deptFilter">
          <option value="">ทั้งหมด</option>
        </select>
      </div>

      <!-- Action buttons -->
      <div class="btn-row">
        <button class="btn btn-search" onclick="loadData()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          ค้นหา
        </button>
        <button class="btn btn-csv" onclick="exportCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV
        </button>
        <button class="btn btn-pdf" onclick="exportPDF()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF
        </button>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card accent-card"><div class="stat-label">รายการทั้งหมด</div><div class="stat-value" id="statTotal">—</div></div>
    <div class="stat-card"><div class="stat-label">พนักงานทั้งหมด</div><div class="stat-value" id="statEmp">—</div></div>
    <div class="stat-card amber-card"><div class="stat-label">จำนวนแผนก</div><div class="stat-value" id="statDept">—</div></div>
    <div class="stat-card"><div class="stat-label">ช่วงข้อมูล</div><div class="stat-value" id="statRange" style="font-size:14px; padding-top:6px;">—</div></div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <div class="table-header-row">
      <span class="table-title" id="tableTitle">ข้อมูลการย้ายพนักงาน</span>
      <span class="table-count" id="tableCount"></span>
    </div>
    <div class="table-wrap">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td colspan="7"><div class="state-box"><div class="state-icon">📋</div><div class="state-msg">กดปุ่ม "ค้นหา" เพื่อโหลดข้อมูล</div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzRm1_KG0CWBaXFEKd63EzRxAy3CR5Vss-hJyArqQbTdyVsCgxACOT_hwKtCH9VLxg/exec'; // ← แทนที่ด้วย URL ของ Apps Script Web App

  let currentView = 'dept';
  let allData = [];
  let departments = [];

  // ── VIEW MODE ────────────────────────────────────────────────────
  function setView(mode, btn) {
    currentView = mode;
    document.querySelectorAll('#viewTabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderDynamicFilters();
  }

  function renderDynamicFilters() {
    const container = document.getElementById('dynamicFilters');
    container.innerHTML = '';

    const today = new Date().toISOString().split('T')[0];
    const thisYear = new Date().getFullYear();
    const thisMonth = String(new Date().getMonth() + 1).padStart(2, '0');

    if (currentView === 'day') {
      container.innerHTML = `
        <div class="filter-group"><label>วันที่</label>
          <input type="date" id="filterDate" value="${today}" /></div>`;

    } else if (currentView === 'week') {
      // get Monday of this week
      const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const mon = d.toISOString().split('T')[0];
      container.innerHTML = `
        <div class="filter-group"><label>วันเริ่มต้น (จันทร์)</label>
          <input type="date" id="filterWeekStart" value="${mon}" /></div>`;

    } else if (currentView === 'month') {
      container.innerHTML = `
        <div class="filter-group"><label>เดือน</label>
          <input type="month" id="filterMonth" value="${thisYear}-${thisMonth}" style="height:38px;padding:0 12px;border:1px solid var(--silver);border-radius:var(--radius);font-family:inherit;font-size:13px;" /></div>`;

    } else if (currentView === 'year') {
      const opts = Array.from({length:6}, (_,i) => thisYear - i)
        .map(y => `<option value="${y}" ${y===thisYear?'selected':''}>${y}</option>`).join('');
      container.innerHTML = `
        <div class="filter-group"><label>ปี</label>
          <select id="filterYear">${opts}</select></div>`;
    }
  }

  // ── FETCH DATA ───────────────────────────────────────────────────
  function loadData() {
    setLoading(true);
    const params = buildParams();

    fetch(`${SCRIPT_URL}?${params}`)
      .then(r => r.json())
      .then(data => {
        allData = data.records || [];
        departments = data.departments || [];
        populateDeptFilter();
        applyDeptFilter();
        updateStats(data);
        updateLastUpdated();
      })
      .catch(err => {
        console.error(err);
        showError('ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบการตั้งค่า');
      });
  }

  function buildParams() {
    const p = new URLSearchParams({ action: 'getData', view: currentView });
    if (currentView === 'day')   { p.set('date', val('filterDate')); }
    if (currentView === 'week')  { p.set('weekStart', val('filterWeekStart')); }
    if (currentView === 'month') { p.set('month', val('filterMonth')); }
    if (currentView === 'year')  { p.set('year', val('filterYear')); }
    return p.toString();
  }

  function val(id) {
    const el = document.getElementById(id);
    return el ? el.value : '';
  }

  // ── DEPT FILTER (CLIENT-SIDE) ─────────────────────────────────────
  function populateDeptFilter() {
    const sel = document.getElementById('deptFilter');
    const cur = sel.value;
    sel.innerHTML = '<option value="">ทั้งหมด</option>';
    departments.forEach(d => {
      sel.innerHTML += `<option value="${d}">${d}</option>`;
    });
    if (cur) sel.value = cur;
  }

  function applyDeptFilter() {
    const dept = document.getElementById('deptFilter').value;
    const filtered = dept ? allData.filter(r => r.deptTo === dept || r.deptFrom === dept) : allData;
    renderTable(filtered);
  }

  // ── RENDER TABLE ─────────────────────────────────────────────────
  function renderTable(rows) {
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    const count = document.getElementById('tableCount');

    head.innerHTML = `<tr>
      <th>#</th><th>ลำดับ</th><th>วันที่</th><th>รหัส</th><th>ชื่อ</th>
      <th>แผนกต้นทาง</th><th>แผนกปลายทาง</th><th>หมายเหตุ</th>
    </tr>`;

    count.textContent = `${rows.length} รายการ`;

    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="8"><div class="state-box">
        <div class="state-icon">🔍</div>
        <div class="state-msg">ไม่พบข้อมูลในช่วงที่เลือก</div>
      </div></td></tr>`;
      return;
    }

    body.innerHTML = rows.map((r, i) => `
      <tr>
        <td class="mono">${i + 1}</td>
        <td class="mono">${r.seq || ''}</td>
        <td style="white-space:nowrap">${formatDate(r.date)}</td>
        <td class="mono">${r.empId || ''}</td>
        <td style="font-weight:500">${r.name || ''}</td>
        <td><span class="badge-dept">${r.deptFrom || ''}</span></td>
        <td><span class="badge-dept" style="background:#FEF0E8;color:#8B3A00;">${r.deptTo || ''}</span></td>
        <td style="color:var(--mid);font-size:12px">${r.note || ''}</td>
      </tr>`).join('');
  }

  // ── STATS ─────────────────────────────────────────────────────────
  function updateStats(data) {
    document.getElementById('statTotal').textContent = (data.records || []).length;
    const empSet = new Set((data.records || []).map(r => r.empId).filter(Boolean));
    document.getElementById('statEmp').textContent = empSet.size;
    document.getElementById('statDept').textContent = (data.departments || []).length;
    document.getElementById('statRange').textContent = data.range || '—';
  }

  // ── LOADING / ERROR ───────────────────────────────────────────────
  function setLoading(on) {
    const body = document.getElementById('tableBody');
    if (on) body.innerHTML = `<tr><td colspan="8"><div class="state-box">
      <div class="loading-spin"></div><div class="state-msg">กำลังโหลดข้อมูล...</div>
    </div></td></tr>`;
  }

  function showError(msg) {
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="8">
      <div class="state-box"><div class="state-icon">⚠️</div>
      <div class="state-msg">${msg}</div></div></td></tr>`;
  }

  // ── EXPORT CSV ────────────────────────────────────────────────────
  function exportCSV() {
    const dept = document.getElementById('deptFilter').value;
    const rows = dept ? allData.filter(r => r.deptTo === dept || r.deptFrom === dept) : allData;
    if (!rows.length) { alert('ไม่มีข้อมูลสำหรับ Export'); return; }

    const headers = ['ลำดับ', 'วันที่', 'รหัสพนักงาน', 'ชื่อ', 'แผนกปลายทาง', 'แผนกต้นทาง', 'หมายเหตุ'];
    const lines = [headers.join(',')];
    rows.forEach(r => {
      lines.push([r.seq, r.date, r.empId, r.name, r.deptTo, r.deptFrom, r.note || '']
        .map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','));
    });

    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `TST_Report_${currentView}_${today()}.csv`;
    a.click(); URL.revokeObjectURL(url);
  }

  // ── EXPORT PDF ────────────────────────────────────────────────────
  function exportPDF() {
    document.querySelector('.watermark-overlay').style.display = 'block';
    window.print();
    setTimeout(() => {
      document.querySelector('.watermark-overlay').style.display = 'none';
    }, 1000);
  }

  // ── HELPERS ───────────────────────────────────────────────────────
  function formatDate(d) {
    if (!d) return '';
    try {
      const dt = new Date(d);
      return dt.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch { return d; }
  }

  function today() { return new Date().toISOString().slice(0, 10).replace(/-/g, ''); }

  function updateLastUpdated() {
    const now = new Date().toLocaleString('th-TH');
    document.getElementById('lastUpdated').textContent = `อัปเดต: ${now}`;
  }

  // ── INIT ──────────────────────────────────────────────────────────
  renderDynamicFilters();
</script>
</body>
</html>
