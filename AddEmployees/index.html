<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เพิ่มรายชื่อพนักงานใหม่</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 20px; }
    .form-container {
      background: white; padding: 30px; border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto;
    }
    h2 { color: #2c3e50; margin-bottom: 30px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
    .section-title { background-color: #3498db; color: white; padding: 10px; border-radius: 5px; margin: 20px 0; }
    .required::after { content: " *"; color: red; }
    .date-format-info { font-size: 0.85em; color: #6c757d; margin-top: 5px; }
    footer { text-align: center; padding: 30px; color: #6c757d; font-size: 0.9rem; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2 class="text-center">เพิ่มรายชื่อพนักงานใหม่</h2>

    <div id="message" class="alert" style="display: none;"></div>

    <form id="employeeForm">
      <div class="section-title">ข้อมูลพื้นฐาน</div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label required">รหัสพนักงาน</label>
          <input type="text" class="form-control" id="code" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label required">ชื่อ-นามสกุล</label>
          <input type="text" class="form-control" id="name" required>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">เพศ</label>
          <select class="form-select" id="sex">
            <option value="">เลือกเพศ</option>
            <option value="ชาย">ชาย</option>
            <option value="หญิง">หญิง</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">ฝ่าย</label>
          <select class="form-select" id="section"><option value="">เลือกฝ่าย</option></select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">แผนก</label>
          <select class="form-select" id="department"><option value="">เลือกแผนก</option></select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label required">ตำแหน่ง</label>
          <input type="text" class="form-control" id="position" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label required">วันเริ่มงาน</label>
          <input type="text" class="form-control" id="startDate" placeholder="dd/MM/yyyy" required>
          <div class="date-format-info"><span>ตัวอย่าง: 01/07/2569 (พ.ศ.)</span></div>
        </div>
      </div>

      <div class="section-title">สิทธิการลา (วัน)</div>
      <div class="row">
        <div class="col-md-4 mb-3"><label class="form-label">ลาพักร้อน 6 วัน</label><input type="number" class="form-control" id="leave6" value="0" min="0"></div>
        <div class="col-md-4 mb-3"><label class="form-label">ลาพักร้อน 7 วัน</label><input type="number" class="form-control" id="leave7" value="0" min="0"></div>
        <div class="col-md-4 mb-3"><label class="form-label">ลาพักร้อน 8 วัน</label><input type="number" class="form-control" id="leave8" value="0" min="0"></div>
      </div>
      <div class="row">
        <div class="col-md-3 mb-3"><label class="form-label">ลากิจ (จ่ายเงิน)</label><input type="number" class="form-control" id="personalPaid" value="0" min="0"></div>
        <div class="col-md-3 mb-3"><label class="form-label">ลากิจ (หักเงิน)</label><input type="number" class="form-control" id="personalUnpaid" value="0" min="0"></div>
        <div class="col-md-3 mb-3"><label class="form-label">ลาป่วย (จ่ายเงิน)</label><input type="number" class="form-control" id="sickPaid" value="0" min="0"></div>
        <div class="col-md-3 mb-3"><label class="form-label">ลาป่วย (หักเงิน)</label><input type="number" class="form-control" id="sickUnpaid" value="0" min="0"></div>
      </div>
      <div class="row">
        <div class="col-md-3 mb-3"><label class="form-label">ลาบวช</label><input type="number" class="form-control" id="ordination" value="0" min="0"></div>
        <div class="col-md-3 mb-3"><label class="form-label">ลาคลอด</label><input type="number" class="form-control" id="maternity" value="0" min="0"></div>
        <div class="col-md-3 mb-3"><label class="form-label">ลารับราชการทหาร</label><input type="number" class="form-control" id="military" value="0" min="0"></div>
        <div class="col-md-3 mb-3"><label class="form-label">ลาทำหมัน</label><input type="number" class="form-control" id="sterilization" value="0" min="0"></div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3"><label class="form-label">ลาเยี่ยมบุตร</label><input type="number" class="form-control" id="visitChild" value="0" min="0"></div>
        <div class="col-md-6 mb-3"><label class="form-label">ลาดูแลบุตร</label><input type="number" class="form-control" id="childcare" value="0" min="0"></div>
      </div>

      <div class="section-title">บทบาทและสิทธิ์</div>
      <div class="row">
        <div class="col-md-12 mb-3">
          <label class="form-label">บทบาท</label>
          <select class="form-select" id="role">
            <option value="">เลือกบทบาท</option>
            <option value="employee">พนักงาน</option>
            <option value="approver_header">หัวหน้างาน</option>
            <option value="approver_supervisor">หัวหน้าแผนก</option>
            <option value="approver_manager">ผู้จัดการ</option>
          </select>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary btn-lg">บันทึกข้อมูล</button>
        <button type="button" class="btn btn-secondary btn-lg ms-2" onclick="clearForm()">ล้างฟอร์ม</button>
        <a href="./edit.html" class="btn btn-outline-primary btn-lg ms-2">
          <i class="fas fa-users-cog me-1"></i>แก้ไข / ลบพนักงาน
        </a>
      </div>
    </form>
  </div>

  <footer>
    <p>ระบบเพิ่มรายชื่อพนักงานใหม่ TokaiSolidtire Co.,Ltd. © 2026 | พัฒนาโดย Sarawut.C</p>
    <p>สำหรับใช้ภายในองค์กรเท่านั้น</p>
  </footer>

  <div class="modal fade" id="errorModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger">
          <h5 class="modal-title text-white"><i class="fas fa-exclamation-circle me-2"></i>เกิดข้อผิดพลาด</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
          <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
          <p id="errorModalMessage" style="font-size:15px;color:#5a5a5a;"></p>
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">ปิด</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./js/common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      populateSectionSelect(document.getElementById("section"));
      try {
        const departments = await fetchDepartments();
        populateDepartmentSelect(document.getElementById("department"), departments);
      } catch (e) {
        console.error("โหลดแผนกไม่สำเร็จ:", e);
      }
    });

    document.getElementById("employeeForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const startDateValue = document.getElementById("startDate").value.trim();
      const startDateIso = thaiDateToIso(startDateValue);
      if (!startDateIso) {
        showMessage("กรุณากรอกวันเริ่มงานในรูปแบบ dd/MM/yyyy (พ.ศ. ระหว่าง 2500-2600) เช่น 01/07/2569", "danger");
        return;
      }

      const employeeData = {
        code: document.getElementById("code").value.trim(),
        name: document.getElementById("name").value.trim(),
        sex: document.getElementById("sex").value,
        section: document.getElementById("section").value,
        department: document.getElementById("department").value,
        position: document.getElementById("position").value.trim(),
        startDateIso,
        leave6: parseInt(document.getElementById("leave6").value) || 0,
        leave7: parseInt(document.getElementById("leave7").value) || 0,
        leave8: parseInt(document.getElementById("leave8").value) || 0,
        personalPaid: parseInt(document.getElementById("personalPaid").value) || 0,
        personalUnpaid: parseInt(document.getElementById("personalUnpaid").value) || 0,
        sickPaid: parseInt(document.getElementById("sickPaid").value) || 0,
        sickUnpaid: parseInt(document.getElementById("sickUnpaid").value) || 0,
        ordination: parseInt(document.getElementById("ordination").value) || 0,
        maternity: parseInt(document.getElementById("maternity").value) || 0,
        military: parseInt(document.getElementById("military").value) || 0,
        sterilization: parseInt(document.getElementById("sterilization").value) || 0,
        visitChild: parseInt(document.getElementById("visitChild").value) || 0,
        childcare: parseInt(document.getElementById("childcare").value) || 0,
        role: document.getElementById("role").value,
      };

      if (!employeeData.code || !employeeData.name || !employeeData.position) {
        showMessage("กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน", "danger");
        return;
      }
      if (employeeData.code.length < 4) {
        showMessage("รหัสพนักงานควรมีอย่างน้อย 4 ตัวอักษร", "danger");
        return;
      }
      if (!employeeData.section) { showMessage("กรุณาเลือกฝ่าย", "danger"); return; }
      if (!employeeData.department) { showMessage("กรุณาเลือกแผนก", "danger"); return; }
      if (!employeeData.role) { showMessage("กรุณาเลือกบทบาท", "danger"); return; }

      const submitBtn = document.querySelector('#employeeForm button[type="submit"]');
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';
      submitBtn.disabled = true;

      try {
        const dupError = await checkDuplicate(employeeData.code, employeeData.name);
        if (dupError) throw new Error(dupError);

        const row = formToDbRow(employeeData);
        const { data, error } = await supabaseClient.from("employees").insert(row).select().single();
        if (error) throw error;

        const messageDiv = document.getElementById("message");
        messageDiv.className = "alert alert-success";
        messageDiv.innerHTML = `
          <h5><i class="fas fa-check-circle"></i> บันทึกข้อมูลพนักงานเรียบร้อยแล้ว</h5>
          <hr>
          <p><strong>รหัสผ่านเริ่มต้น:</strong> <span class="badge bg-primary">${escapeHtml(data.password)}</span></p>
          <p class="mb-0"><small>หมายเหตุ: รหัสผ่านเริ่มต้นคือ 6 ตัวท้ายของรหัสพนักงาน โปรดแจ้งให้พนักงานทราบ</small></p>
        `;
        messageDiv.style.display = "block";
        clearForm();
      } catch (err) {
        showErrorModal(err.message || "เกิดข้อผิดพลาดไม่ทราบสาเหตุ");
      } finally {
        submitBtn.innerHTML = "บันทึกข้อมูล";
        submitBtn.disabled = false;
      }
    });

    function showErrorModal(message) {
      document.getElementById("errorModalMessage").textContent = message;
      new bootstrap.Modal(document.getElementById("errorModal")).show();
    }

    function showMessage(message, type) {
      const messageDiv = document.getElementById("message");
      messageDiv.className = `alert alert-${type}`;
      messageDiv.textContent = message;
      messageDiv.style.display = "block";
      setTimeout(() => { messageDiv.style.display = "none"; }, 5000);
    }

    async function clearForm() {
      document.getElementById("employeeForm").reset();
      document.querySelectorAll('input[type="number"]').forEach((el) => (el.value = 0));
      document.getElementById("startDate").value = "";
      try {
        const departments = await fetchDepartments();
        populateDepartmentSelect(document.getElementById("department"), departments);
      } catch (e) { /* ignore */ }
    }
  </script>
</body>
</html>
