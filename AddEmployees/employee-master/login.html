<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — Employee Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card { width:100%; max-width:380px; }
  .login-brand { text-align:center; margin-bottom:22px; }
  .login-brand .mark { width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg, var(--color-accent), #12C79E); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-family:var(--font-display); font-weight:700; color:#072620; font-size:19px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">EM</div>
      <h1 style="font-size:18px;">Employee Master</h1>
      <p style="color:var(--color-text-muted); font-size:12.8px; margin-top:2px;">ฐานข้อมูลกลางพนักงาน</p>
    </div>
    <div class="panel panel-pad">
      <form id="login-form">
        <div class="field">
          <label class="field-label">อีเมล <span class="req">*</span></label>
          <input type="email" id="email" class="input" required autocomplete="username">
        </div>
        <div class="field">
          <label class="field-label">รหัสผ่าน <span class="req">*</span></label>
          <input type="password" id="password" class="input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-accent" id="btn-login" style="width:100%; justify-content:center; margin-top:6px;">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>

<script src="assets/config.js"></script>
<script src="assets/supabaseClient.js"></script>
<script>
sb.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'app.html';
});

document.getElementById('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
    return;
  }
  window.location.href = 'app.html';
});
</script>
</body>
</html>
