<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการแผนก — HR Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2B3E;
    --ink-soft:#6E85A0;
    --bg-a:#EAF3FB;
    --bg-b:#F7FBFE;
    --panel:#FFFFFF;
    --line:#DCE9F5;
    --accent:#2F7FB8;
    --accent-dark:#24628F;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7F2FB;
    --accent-soft-2:#F1F8FD;
    --danger:#C1596A;
    --danger-soft:#FBEBEE;
    --radius:16px;
    --shadow:0 1px 2px rgba(27,60,90,.04), 0 10px 30px rgba(27,60,90,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 320px, var(--bg-b) 100%);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif; margin:0; font-weight:600; letter-spacing:-0.01em;}

  /* ---------- login ---------- */
  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:38px 34px; box-shadow:var(--shadow); text-align:center;
  }
  .login-mark{
    width:52px; height:52px; margin:0 auto 18px; border-radius:14px;
    background:linear-gradient(135deg, var(--accent), #6FB4E0);
    display:flex; align-items:center; justify-content:center;
  }
  .login-mark svg{width:26px; height:26px;}
  .login-card h1{font-size:20px; margin-bottom:6px;}
  .login-card p{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px;}
  .login-card label{text-align:left;}

  /* ---------- header ---------- */
  #app{display:none;}
  header{
    background:rgba(255,255,255,.85); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:16px 32px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), #6FB4E0);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{width:18px; height:18px;}
  header h1{font-size:17px;}
  header .who{font-size:13px; color:var(--ink-soft);}
  .btn-ghost{
    background:#fff; border:1px solid var(--line); color:var(--ink-soft);
    padding:8px 16px; border-radius:10px; font-size:13.5px; cursor:pointer; transition:.15s;
    text-decoration:none; display:inline-flex; align-items:center;
  }
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent-dark);}

  main{max-width:1100px; margin:0 auto; padding:32px;}
  @media (max-width:860px){ main{padding:20px;} header{padding:14px 20px;} }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; box-shadow:var(--shadow);
  }

  label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; margin-top:16px; font-weight:500;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=email], input[type=password], select{
    width:100%; padding:10px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14px; font-family:inherit; color:var(--ink); background:#fff; transition:.15s;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  input:disabled{background:#F3F6FA; color:var(--ink-soft);}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:5px;}

  .check-row{display:flex; align-items:center; gap:10px; margin-top:18px; cursor:pointer; font-size:14px; color:var(--ink);}
  .check-row input{width:17px; height:17px; accent-color:var(--accent);}

  .btn{
    padding:11px 18px; border-radius:10px; border:none; font-size:14px; font-weight:600;
    font-family:inherit; cursor:pointer; transition:.15s;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary:disabled{opacity:.6; cursor:default;}
  .btn-cancel{background:var(--accent-soft-2); color:var(--ink-soft);}
  .btn-cancel:hover{color:var(--ink); background:var(--accent-soft);}
  #login-btn{width:100%; margin-top:22px;}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .toolbar .grow{flex:1; min-width:200px;}
  .toolbar select{width:auto; min-width:170px;}
  .toggle{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .toggle input{width:16px; height:16px; accent-color:var(--accent);}
  .count-tag{
    font-size:12.5px; color:var(--accent-dark); background:var(--accent-soft);
    padding:5px 12px; border-radius:100px; white-space:nowrap; font-weight:600;
  }

  /* ---------- table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; font-weight:600; color:var(--ink-soft); font-size:12px;
    padding:10px 12px; border-bottom:1.5px solid var(--line);
  }
  td{padding:12px; border-bottom:1px solid var(--bg-a); vertical-align:middle;}
  tr:hover td{background:var(--accent-soft-2);}
  .code-cell{
    color:var(--accent-dark); font-weight:600; background:var(--accent-soft);
    padding:3px 9px; border-radius:7px; display:inline-block; white-space:nowrap;
  }
  .num{text-align:right; font-variant-numeric:tabular-nums;}
  .badge{display:inline-block; padding:3px 10px; border-radius:100px; font-size:12px; font-weight:600; white-space:nowrap;}
  .badge-on{background:#E5F5EC; color:#1F8A4C;}
  .badge-off{background:#F1F2F4; color:#6E7580;}
  .row-actions{white-space:nowrap; text-align:right;}
  .link-btn{
    background:none; border:none; color:var(--accent); font-size:13px; cursor:pointer;
    padding:4px 8px; margin-left:4px; border-radius:7px; font-family:inherit;
    display:inline-flex; align-items:center; gap:4px;
  }
  .link-btn:hover{background:var(--accent-soft);}
  .link-btn.danger{color:var(--danger);}
  .link-btn.danger:hover{background:var(--danger-soft);}
  .empty-state{text-align:center; color:var(--ink-soft); padding:48px 0; font-size:14px;}

  /* ---------- banner ---------- */
  #status-banner{display:none; max-width:1100px; margin:0 auto; padding:0 32px;}
  .banner{padding:12px 18px; border-radius:12px; font-size:13.5px; box-shadow:var(--shadow); font-weight:500; background:#fff;}
  .banner.ok{color:var(--accent-dark); border:1px solid var(--accent-soft);}
  .banner.err{color:var(--danger); border:1px solid var(--danger-soft);}

  /* ---------- modal ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,40,60,.35); backdrop-filter:blur(2px);
    align-items:flex-start; justify-content:center; padding:8vh 20px; z-index:100; overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    width:100%; max-width:440px; background:var(--panel); border-radius:20px;
    box-shadow:0 20px 60px rgba(20,40,60,.25); padding:26px 28px 28px;
    animation:modal-in .18s ease-out;
  }
  @keyframes modal-in{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .modal-header h2{font-size:16px;}
  .modal-close{
    background:var(--accent-soft-2); border:none; width:30px; height:30px; border-radius:9px;
    color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .modal-close:hover{background:var(--danger-soft); color:var(--danger);}
  .form-actions{display:flex; gap:10px; margin-top:24px;}
  .form-actions .btn{flex:1;}

  .app-footer{text-align:center; color:var(--ink-soft); font-size:12.5px; padding:24px 20px 32px;}
</style>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/>
        </svg>
      </div>
      <h1>จัดการแผนก</h1>
      <p>เข้าสู่ระบบด้วยบัญชี</p>
      <p>User: hr@local.com / Pass: mm169Moo4</p>
      <label for="login-email">อีเมล</label>
      <input id="login-email" type="email" autocomplete="username" placeholder="">
      <label for="login-password">รหัสผ่าน</label>
      <input id="login-password" type="password" autocomplete="current-password">
      <button id="login-btn" class="btn btn-primary">เข้าสู่ระบบ</button>
      <p id="login-error" style="color:var(--danger); font-size:13px; margin:12px 0 0; display:none;"></p>
    </div>
  </div>

  <div id="status-banner"><div class="banner" id="banner-inner"></div></div>

  <!-- ============ APP ============ -->
  <div id="app">
    <header>
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/>
          </svg>
        </div>
        <h1>จัดการแผนก</h1>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <a class="btn-ghost" href="HR-admin.html">← จัดการพนักงาน</a>
        <span class="who" id="who-label"></span>
        <button class="btn-ghost" id="logout-btn">ออกจากระบบ</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="toolbar">
          <input id="search-box" class="grow" type="text" placeholder="ค้นหารหัส หรือ ชื่อแผนก...">
          <select id="section-filter"><option value="">ทุกฝ่าย</option></select>
          <label class="toggle" style="margin:0;">
            <input type="checkbox" id="show-inactive" checked> แสดงแผนกที่ปิดใช้งาน
          </label>
          <span class="count-tag" id="count-tag"></span>
          <button class="btn btn-primary" id="add-new-btn">+ เพิ่มแผนก</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>รหัสแผนก</th>
                <th>ชื่อแผนก</th>
                <th>ฝ่าย</th>
                <th>สถานะ</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="dept-tbody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="empty-state" style="display:none;">ไม่พบแผนก</div>
      </section>
    </main>

    <footer class="app-footer">
      ระบบฐานข้อมูลฝ่ายบุคคล | ใช้ภายในบริษัทเท่านั้น | พัฒนาโดย Sarawut.C
    </footer>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">เพิ่มแผนก</h2>
        <button type="button" id="modal-close-btn" class="modal-close" aria-label="ปิด">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="dept-form">
        <label for="f-code">รหัสแผนก</label>
        <input id="f-code" type="text" required placeholder="เช่น 206-1" autocomplete="off">
        <div class="hint" id="f-code-hint">รหัสเป็นตัวระบุหลักและใช้เชื่อมกับระบบอื่น แก้ไขไม่ได้หลังสร้าง</div>

        <label for="f-name">ชื่อแผนก</label>
        <input id="f-name" type="text" required placeholder="เช่น ผ.คลังสินค้า" autocomplete="off">

        <label for="f-section">ฝ่าย</label>
        <select id="f-section" required>
          <option value="" disabled selected>เลือกฝ่าย</option>
        </select>

        <label class="check-row">
          <input type="checkbox" id="f-active" checked>
          เปิดใช้งาน
        </label>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn btn-cancel">ยกเลิก</button>
          <button type="submit" class="btn btn-primary" id="save-btn">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ============================================================
  // ใส่ค่าโปรเจค hr-master (ค่าเดียวกับที่ใช้ใน hr-admin.html)
  // anon key ฝังในหน้าเว็บได้ เพราะ RLS เป็นตัวคุมสิทธิ์จริง
  // ============================================================
  const SUPABASE_URL = "https://ppzdyvomrfiitahxwrwz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let sections = [];      // {section_id, name}
  let departments = [];   // {department_code, name, section_id, is_active}
  let empCount = {};      // department_code -> จำนวนพนักงาน
  let editingCode = null; // null = เพิ่มใหม่

  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function showBanner(message, isError=false){
    const inner = el('banner-inner');
    inner.textContent = message;
    inner.className = 'banner ' + (isError ? 'err' : 'ok');
    el('status-banner').style.display = 'block';
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => el('status-banner').style.display = 'none', 4500);
  }

  // ---------------- AUTH ----------------
  el('login-btn').addEventListener('click', async () => {
    el('login-error').style.display = 'none';
    const { error } = await sb.auth.signInWithPassword({
      email: el('login-email').value.trim(),
      password: el('login-password').value
    });
    if (error) {
      el('login-error').textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message;
      el('login-error').style.display = 'block';
    }
  });
  el('login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('login-btn').click(); });
  el('logout-btn').addEventListener('click', () => sb.auth.signOut());

  sb.auth.onAuthStateChange((_event, session) => {
    if (session) {
      el('login-screen').style.display = 'none';
      el('app').style.display = 'block';
      el('who-label').textContent = session.user.email;
      init();
    } else {
      el('login-screen').style.display = 'flex';
      el('app').style.display = 'none';
    }
  });

  // ---------------- LOAD ----------------
  async function init(){
    const [secRes, depRes, empRes] = await Promise.all([
      sb.from('sections').select('section_id, name').order('name'),
      sb.from('departments').select('department_code, name, section_id, is_active').order('department_code'),
      sb.from('employees').select('department_code')
    ]);
    if (secRes.error || depRes.error) {
      showBanner('โหลดข้อมูลไม่สำเร็จ: ' + (secRes.error || depRes.error).message, true);
      return;
    }
    sections = secRes.data;
    departments = depRes.data;
    empCount = {};
    (empRes.data || []).forEach(e => { empCount[e.department_code] = (empCount[e.department_code] || 0) + 1; });

    const opts = sections.map(s => `<option value="${s.section_id}">${esc(s.name)}</option>`).join('');
    el('section-filter').innerHTML = '<option value="">ทุกฝ่าย</option>' + opts;
    el('f-section').innerHTML = '<option value="" disabled selected>เลือกฝ่าย</option>' + opts;
    render();
  }

  function sectionName(id){
    const s = sections.find(x => x.section_id === id);
    return s ? s.name : '-';
  }

  function render(){
    const q = el('search-box').value.trim().toLowerCase();
    const sec = el('section-filter').value;
    const showInactive = el('show-inactive').checked;

    const rows = departments.filter(d =>
      (showInactive || d.is_active) &&
      (!sec || String(d.section_id) === sec) &&
      (!q || d.department_code.toLowerCase().includes(q) || d.name.toLowerCase().includes(q))
    );

    el('count-tag').textContent = rows.length + ' แผนก';
    el('empty-state').style.display = rows.length ? 'none' : 'block';
    el('dept-tbody').innerHTML = rows.map(d => `
      <tr>
        <td><span class="code-cell">${esc(d.department_code)}</span></td>
        <td>${esc(d.name)}</td>
        <td>${esc(sectionName(d.section_id))}</td>
        <td><span class="badge ${d.is_active ? 'badge-on' : 'badge-off'}">${d.is_active ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}</span></td>
        <td class="row-actions">
          <button class="link-btn" data-edit="${esc(d.department_code)}">แก้ไข</button>
          <button class="link-btn danger" data-delete="${esc(d.department_code)}">ลบ</button>
        </td>
      </tr>
    `).join('');
  }

  el('search-box').addEventListener('input', render);
  el('section-filter').addEventListener('change', render);
  el('show-inactive').addEventListener('change', render);

  el('dept-tbody').addEventListener('click', (e) => {
    const edit = e.target.closest('[data-edit]');
    const del = e.target.closest('[data-delete]');
    if (edit) openEdit(edit.getAttribute('data-edit'));
    if (del) deleteDepartment(del.getAttribute('data-delete'));
  });

  // ---------------- MODAL ----------------
  function openModal(){ el('modal-overlay').classList.add('open'); }
  function closeModal(){ el('modal-overlay').classList.remove('open'); }
  el('modal-close-btn').addEventListener('click', closeModal);
  el('cancel-btn').addEventListener('click', closeModal);
  el('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  el('add-new-btn').addEventListener('click', () => {
    editingCode = null;
    el('dept-form').reset();
    el('f-code').disabled = false;
    el('f-code-hint').style.display = 'block';
    el('f-active').checked = true;
    el('f-section').value = '';
    el('modal-title').textContent = 'เพิ่มแผนก';
    el('save-btn').textContent = 'บันทึก';
    openModal();
    el('f-code').focus();
  });

  function openEdit(code){
    const d = departments.find(x => x.department_code === code);
    if (!d) return;
    editingCode = code;
    el('f-code').value = d.department_code;
    el('f-code').disabled = true;   // department_code เป็น primary key แก้ไม่ได้
    el('f-code-hint').style.display = 'none';
    el('f-name').value = d.name;
    el('f-section').value = d.section_id ?? '';
    el('f-active').checked = !!d.is_active;
    el('modal-title').textContent = 'แก้ไขแผนก: ' + code;
    el('save-btn').textContent = 'บันทึกการแก้ไข';
    openModal();
  }

  // ---------------- SAVE ----------------
  el('dept-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = el('f-code').value.trim();
    const name = el('f-name').value.trim();
    const sectionId = Number(el('f-section').value);
    const isActive = el('f-active').checked;
    if (!code || !name || !sectionId) { showBanner('กรุณากรอกข้อมูลให้ครบ', true); return; }

    el('save-btn').disabled = true;
    try {
      if (editingCode) {
        const { error } = await sb.from('departments')
          .update({ name, section_id: sectionId, is_active: isActive })
          .eq('department_code', editingCode);
        if (error) throw error;
        showBanner('บันทึกการแก้ไขเรียบร้อย');
      } else {
        const { error } = await sb.from('departments')
          .insert({ department_code: code, name, section_id: sectionId, is_active: isActive });
        if (error) throw error;
        showBanner('เพิ่มแผนกเรียบร้อย');
      }
      closeModal();
      await init();
    } catch (err) {
      if (err.code === '23505') showBanner(`รหัสแผนก "${code}" มีอยู่แล้ว`, true);
      else showBanner('บันทึกไม่สำเร็จ: ' + err.message, true);
    } finally {
      el('save-btn').disabled = false;
    }
  });

  // ---------------- DELETE ----------------
  async function deleteDepartment(code){
    const n = empCount[code] || 0;
    if (n > 0) {
      showBanner(`ลบไม่ได้: แผนก ${code} ยังมีพนักงาน ${n} คน — ย้ายพนักงานออกก่อน หรือกดแก้ไขแล้วปิดการใช้งานแทน`, true);
      return;
    }
    if (!confirm(`ยืนยันลบแผนก ${code} ออกจากฐานข้อมูลกลาง?`)) return;
    const { error } = await sb.from('departments').delete().eq('department_code', code);
    if (error) {
      if (error.code === '23503') showBanner('ลบไม่ได้: แผนกนี้ถูกอ้างอิงอยู่ในข้อมูลอื่น — ใช้การปิดการใช้งานแทน', true);
      else showBanner('ลบไม่สำเร็จ: ' + error.message, true);
      return;
    }
    showBanner('ลบแผนกเรียบร้อย');
    await init();
  }
</script>
</body>
</html>
