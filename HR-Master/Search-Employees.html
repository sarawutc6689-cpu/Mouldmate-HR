<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ค้นหาพนักงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  /* ใช้ Sarabun เป็นหลัก + ฟอนต์สำรองราชการไทย Angsana New, Cordia New */
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
  background: #F0F4FA;
  color: #1E2F45;
  line-height: 1.5;
  font-size: 15px;
}

/* ===== LAYOUT ===== */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 280px;
  background: #FFFFFF;
  border-right: 1px solid #E4ECF5;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: all 0.25s ease;
  box-shadow: 0 0 20px rgba(0, 28, 48, 0.02);
}

.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid #EFF3FA;
  margin-bottom: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(145deg, #1E5A8A, #124263);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 22px;
  box-shadow: 0 8px 14px -6px rgba(27, 83, 124, 0.25);
}

.brand-text h2 {
  font-size: 18px;
  font-weight: 700;
  color: #0C2F4C;
  letter-spacing: -0.2px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.brand-text p {
  font-size: 11px;
  color: #6A88A6;
  font-weight: 500;
  margin-top: 2px;
}

.nav-menu {
  flex: 1;
  padding: 0 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 500;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s;
  color: #3C607F;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.nav-item .nav-icon {
  font-size: 20px;
  width: 28px;
  color: #7192B4;
  transition: 0.2s;
}

.nav-item.active {
  background: #EFF6FF;
  color: #1D6CAE;
}

.nav-item.active .nav-icon {
  color: #1D6CAE;
}

.nav-item:hover:not(.active) {
  background: #F6F9FE;
  color: #1F5780;
}

.sidebar-footer {
  padding: 20px 24px 28px;
  border-top: 1px solid #ECF2F9;
  margin-top: auto;
}

.info-card {
  background: #F8FBFE;
  border-radius: 20px;
  padding: 14px 18px;
  text-align: left;
}

.info-card .label {
  font-size: 10px;
  text-transform: uppercase;
  font-weight: 700;
  color: #7A97B5;
  letter-spacing: 0.5px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.info-card .name {
  font-weight: 700;
  font-size: 15px;
  color: #1A4568;
  margin: 6px 0 2px;
}

.info-card .role {
  font-size: 12px;
  color: #6A8AAD;
}

/* ===== MAIN CONTENT ===== */
.main-content {
  margin-left: 280px;
  flex: 1;
  padding: 28px 36px;
  width: calc(100% - 280px);
}

/* Top Bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.page-title h1 {
  font-size: 26px;
  font-weight: 700;
  color: #0E3250;
  letter-spacing: -0.3px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.page-title p {
  font-size: 14px;
  color: #6082A8;
  margin-top: 4px;
}

.status-badge {
  background: #EAF3FC;
  padding: 6px 18px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 500;
  color: #2670A3;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.dot {
  width: 8px;
  height: 8px;
  background: #2F9B5E;
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 0 2px #E2F0E8;
}

/* Hero Card */
.hero-card {
  background: linear-gradient(115deg, #FFFFFF 0%, #F6FAFF 100%);
  border-radius: 32px;
  padding: 24px 32px;
  margin-bottom: 28px;
  border: 1px solid #E9F0F8;
  box-shadow: 0 6px 14px rgba(0, 28, 48, 0.02);
}

.hero-card h2 {
  font-size: 20px;
  font-weight: 600;
  color: #1A4A6F;
  margin-bottom: 6px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.hero-card p {
  color: #5C7F9E;
  font-size: 14px;
}

/* Summary Cards */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 28px;
}

.summary-card {
  background: white;
  border-radius: 28px;
  padding: 18px 20px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.02);
  border: 1px solid #E9F0F8;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: all 0.2s;
}

.summary-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 22px -8px rgba(27, 73, 104, 0.12);
  border-color: #DAE6F2;
}

.summary-icon {
  width: 52px;
  height: 52px;
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}

.summary-icon.blue-light { background: #EAF3FE; color: #267BB0; }
.summary-icon.amber-light { background: #FFF3E6; color: #CD8B32; }
.summary-icon.green-light { background: #EAF9EE; color: #2A7A47; }
.summary-icon.red-light { background: #FEF0F0; color: #C55A5A; }

.summary-info .number {
  font-size: 30px;
  font-weight: 800;
  color: #103A5A;
  line-height: 1.2;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.summary-info .label {
  font-size: 12px;
  font-weight: 600;
  color: #6A8DAD;
  letter-spacing: 0.3px;
  margin-top: 4px;
}

/* Filter Panel */
.filter-panel {
  background: white;
  border-radius: 28px;
  border: 1px solid #E9F0F8;
  padding: 20px 24px;
  margin-bottom: 22px;
}

.filter-title {
  font-size: 13px;
  font-weight: 700;
  color: #1D5985;
  margin-bottom: 14px;
  letter-spacing: 0.4px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.filter-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

.filter-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.filter-group label {
  font-size: 12px;
  font-weight: 700;
  color: #6F8EAE;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

input, select {
  border: 1.5px solid #E2ECF5;
  border-radius: 20px;
  padding: 10px 14px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
  font-size: 14px;
  background: white;
  transition: 0.2s;
  outline: none;
  color: #1C405E;
}

input:focus, select:focus {
  border-color: #86B3D9;
  box-shadow: 0 0 0 3px rgba(38, 112, 163, 0.08);
}

.filter-actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 20px;
}

.btn {
  padding: 8px 22px;
  border-radius: 40px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-outline {
  background: white;
  border: 1.5px solid #D5E2EF;
  color: #4E7395;
}

.btn-outline:hover {
  background: #F8FCFE;
  border-color: #A9C3DD;
}

.btn-primary {
  background: #1D6CAE;
  color: white;
  box-shadow: 0 2px 6px rgba(27, 90, 135, 0.16);
}

.btn-primary:hover {
  background: #135A93;
  transform: translateY(-1px);
}

.btn-export {
  background: #328F5A;
  color: white;
}

.btn-export:hover {
  background: #247A49;
}

/* Tabs */
.tab-bar {
  display: flex;
  gap: 8px;
  background: white;
  border-radius: 60px;
  padding: 6px;
  margin-bottom: 22px;
  border: 1px solid #E9F0F8;
  width: fit-content;
}

.tab-btn {
  padding: 8px 22px;
  border-radius: 50px;
  border: none;
  background: transparent;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #6F8DAB;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn.active {
  background: #1D6CAE;
  color: white;
  box-shadow: 0 3px 8px rgba(29, 108, 174, 0.18);
}

.tab-count {
  background: rgba(0,0,0,0.08);
  border-radius: 40px;
  padding: 2px 8px;
  font-size: 12px;
  font-weight: 700;
}

.tab-btn.active .tab-count {
  background: rgba(255,255,255,0.2);
  color: white;
}

/* Table Card */
.table-card {
  background: white;
  border-radius: 28px;
  border: 1px solid #ECF3FA;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.02);
}

.table-header {
  padding: 16px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1.5px solid #F0F5FC;
  font-size: 13px;
  color: #6F8DAB;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

thead tr {
  background: #F9FCFE;
  border-bottom: 1.5px solid #ECF3FA;
}

thead th {
  padding: 14px 16px;
  text-align: left;
  font-size: 12px;
  font-weight: 700;
  color: #6181A3;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

tbody tr {
  border-bottom: 1px solid #F0F6FD;
  transition: background 0.15s;
}

tbody tr:hover {
  background: #F9FDFF;
}

td {
  padding: 14px 16px;
  vertical-align: middle;
  color: #1F4464;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 40px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.badge-active {
  background: #FFF1E0;
  color: #C47D2E;
  border: 1px solid #FFE2BB;
}

.badge-returned {
  background: #E1F7EA;
  color: #2A7A47;
  border: 1px solid #BDE5CD;
}

.badge-damaged {
  background: #FEEFEF;
  color: #C25B5B;
  border: 1px solid #FCD7D7;
}

.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.request-no {
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', monospace;
  font-weight: 700;
  color: #256E9E;
  font-size: 13px;
}

.btn-return-sm {
  background: #FFFAF0;
  border: 1px solid #F7DEB4;
  padding: 5px 14px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 600;
  color: #B7762E;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.btn-return-sm:hover {
  background: #FEF3E2;
  transform: scale(0.98);
}

.empty-state {
  text-align: center;
  padding: 52px 20px;
  color: #8AACCB;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
  font-size: 14px;
}

.loading-state {
  text-align: center;
  padding: 48px;
}

.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #E1ECF7;
  border-top-color: #2F7DB0;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Pagination */
.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px;
  border-top: 1.5px solid #F0F5FC;
  font-size: 13px;
  color: #6082A5;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.page-btns {
  display: flex;
  gap: 6px;
}

.page-btn {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  border: 1.5px solid #E1EAF3;
  background: white;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: #507193;
  transition: all 0.15s;
}

.page-btn.active {
  background: #1D6CAE;
  border-color: #1D6CAE;
  color: white;
}

.page-btn:hover:not(.active):not(:disabled) {
  border-color: #8EB3D5;
  color: #135A93;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 45, 70, 0.4);
  backdrop-filter: blur(3px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.show {
  display: flex;
  animation: fadeIn 0.2s;
}

.modal {
  background: white;
  border-radius: 36px;
  max-width: 520px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
  animation: slideUp 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.modal-header {
  background: #F9FCFE;
  padding: 20px 24px;
  border-bottom: 1px solid #EDF4FC;
}

.modal-header h3 {
  font-size: 18px;
  color: #134A70;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
  font-weight: 700;
}

.modal-body {
  padding: 24px;
}

.modal-info {
  background: #F7FBFE;
  border-radius: 24px;
  padding: 14px 18px;
  margin-bottom: 20px;
  font-size: 14px;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.modal-info-row {
  display: flex;
  gap: 12px;
  margin-bottom: 6px;
}

.modal-info-label {
  width: 85px;
  font-weight: 700;
  color: #6A8AAD;
}

.modal-info-value {
  font-weight: 500;
  color: #1F4D72;
}

.field-group {
  margin-bottom: 18px;
}

.field-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #6C8FB0;
  margin-bottom: 6px;
  text-transform: uppercase;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.field-group input {
  width: 100%;
  border-radius: 24px;
  padding: 11px 16px;
  font-size: 14px;
}

.condition-radio-group {
  display: flex;
  gap: 16px;
  margin-top: 8px;
}

.cond-option {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px;
  border-radius: 40px;
  border: 1.5px solid #E1EAF3;
  background: white;
  cursor: pointer;
  transition: 0.2s;
  font-weight: 600;
  font-size: 14px;
  color: #4F7396;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.cond-option.active-normal {
  background: #E6F6EC;
  border-color: #328F5A;
  color: #247A49;
}

.cond-option.active-damaged {
  background: #FEF0F0;
  border-color: #D46B6B;
  color: #B94B4B;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 16px 24px 24px;
  border-top: 1px solid #F0F5FC;
}

.btn-modal {
  padding: 10px 26px;
  border-radius: 40px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.btn-modal-cancel {
  background: #F0F5FC;
  color: #4C6F91;
}

.btn-modal-save {
  background: #1D6CAE;
  color: white;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-modal-save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #103A5A;
  color: white;
  padding: 12px 26px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 500;
  z-index: 1000;
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  font-family: 'Sarabun', 'Angsana New', 'Cordia New', sans-serif;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* Responsive */
@media (max-width: 900px) {
  .summary-grid { grid-template-columns: repeat(2,1fr); gap: 14px; }
  .filter-grid { grid-template-columns: repeat(2,1fr); }
}

@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }
  .sidebar.mobile-open {
    transform: translateX(0);
  }
  .main-content {
    margin-left: 0;
    width: 100%;
    padding: 20px;
  }
  .filter-grid { grid-template-columns: 1fr; }
  .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
  .menu-toggle-btn {
    display: block;
    background: white;
    border: 1px solid #DCE7F0;
    border-radius: 30px;
    padding: 8px 14px;
    margin-right: 12px;
  }
}

.menu-toggle-btn {
  display: none;
}

<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-text">
          <h2>ค้นหาพนักงาน</h2>
        </div>
      </div>
    </div>
    <div class="nav-menu">
      <button class="nav-item" id="navEmployeesBtn">

  <div class="main-content">
    <div class="top-bar">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
        <div class="page-title">
          <h1>ค้นหาพนักงาน</h1>
          <p>ค้นหาด้วยรหัสพนักงานหรือชื่อ-นามสกุล</p>
        </div>
      </div>
    </div>

    <div class="hero-card">
      <h2>🔍 ทำเนียบพนักงาน</h2>
      <p>พิมพ์รหัสพนักงานหรือชื่อ (บางส่วนก็ค้นหาได้) เพื่อดูแผนก ฝ่าย และตำแหน่ง</p>
    </div>

    <!-- Search -->
    <div class="filter-panel">
      <div class="filter-title">🔍 ค้นหาพนักงาน</div>
      <div class="filter-grid">
        <div class="filter-group" style="grid-column: span 2;">
          <label>รหัสพนักงาน หรือ ชื่อ-นามสกุล</label>
          <input type="text" id="qSearch" placeholder="" autocomplete="off" />
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn btn-outline" onclick="clearSearch()">⟳ ล้างคำค้นหา</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header"><span>แสดง <strong id="rowCount">0</strong> รายการ</span><span id="updateTime"></span></div>
      <div id="tableContainer"><div class="empty-state">⌨️ พิมพ์รหัสพนักงานหรือชื่อเพื่อเริ่มค้นหา</div></div>
    </div>
  </div>
</div>

<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const qInput = document.getElementById('qSearch');
  const tableContainer = document.getElementById('tableContainer');
  const rowCount = document.getElementById('rowCount');
  const updateTime = document.getElementById('updateTime');
  let searchTimer = null;

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function renderRows(rows) {
    rowCount.innerText = rows.length;
    updateTime.innerText = rows.length ? ('อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH')) : '';
    if (!rows.length) {
      tableContainer.innerHTML = '<div class="empty-state">📭 ไม่พบพนักงานตามคำค้นหา</div>';
      return;
    }
    let html = '<div class="table-wrap"><table><thead><tr>' +
      '<th>รหัสพนักงาน</th><th>ชื่อ-นามสกุล</th><th>แผนก</th><th>ฝ่าย</th><th>ตำแหน่ง</th><th>สถานะ</th>' +
      '</tr></thead><tbody>';
    rows.forEach((r) => {
      const isActive = (r.status || '').toLowerCase() === 'active';
      const statusBadge = r.status
        ? `<span class="badge ${isActive ? 'badge-active' : 'badge-returned'}"><span class="badge-dot"></span>${escapeHtml(r.status)}</span>`
        : '<span style="color:#9DB8D3;">—</span>';
      html += `<tr>
        <td><span class="request-no">${escapeHtml(r.employee_code)}</span></td>
        <td style="font-weight:600;">${escapeHtml(r.full_name)}</td>
        <td>${escapeHtml(r.department_name) || '—'}</td>
        <td>${escapeHtml(r.section_name) || '—'}</td>
        <td>${escapeHtml(r.position_name) || '—'}</td>
        <td>${statusBadge}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
    tableContainer.innerHTML = html;
  }

  async function runSearch(q) {
    tableContainer.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><p>กำลังค้นหา...</p></div>';
    const { data, error } = await sb
      .from('employees_directory')
      .select('employee_code, full_name, department_name, section_name, position_name, status')
      .or(`employee_code.ilike.%${q}%,full_name.ilike.%${q}%`)
      .limit(50);
    if (error) {
      tableContainer.innerHTML = '<div class="empty-state">❌ ค้นหาไม่สำเร็จ: ' + escapeHtml(error.message) + '</div>';
      rowCount.innerText = 0;
      return;
    }
    renderRows(data || []);
  }

  qInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = qInput.value.trim();
    if (!q) {
      tableContainer.innerHTML = '<div class="empty-state">⌨️ พิมพ์รหัสพนักงานหรือชื่อเพื่อเริ่มค้นหา</div>';
      rowCount.innerText = 0;
      updateTime.innerText = '';
      return;
    }
    searchTimer = setTimeout(() => runSearch(q), 350);
  });

  function clearSearch() {
    qInput.value = '';
    tableContainer.innerHTML = '<div class="empty-state">⌨️ พิมพ์รหัสพนักงานหรือชื่อเพื่อเริ่มค้นหา</div>';
    rowCount.innerText = 0;
    updateTime.innerText = '';
    qInput.focus();
  }

  // Mobile sidebar toggle (same behaviour as the other pages)
  document.getElementById('menuToggleBtn').onclick = () => document.getElementById('sidebar').classList.toggle('mobile-open');
  document.addEventListener('click', (e) => { if (window.innerWidth <= 768 && !document.getElementById('sidebar').contains(e.target) && e.target !== document.getElementById('menuToggleBtn')) document.getElementById('sidebar').classList.remove('mobile-open'); });

  document.getElementById('navFormBtn').onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('navReportBtn').onclick = () => { window.location.href = 'report.html'; };
</script>
</body>
</html>
