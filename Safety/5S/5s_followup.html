<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามการแก้ไข 5ส</title>
<style>
  :root {
    --ink: #23281f;
    --muted: #6b7263;
    --line: #d9dccf;
    --paper: #fbfaf5;
    --card: #ffffff;
    --accent: #3d6b3f;
    --accent-dim: #e7efe4;
    --warn: #b3541e;
    --warn-dim: #f7e8dc;
    --danger: #a13a3a;
    --danger-dim: #f5dede;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Sarabun", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    padding-bottom: 60px;
  }
  header {
    padding: 20px 16px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  .config-warning {
    background: var(--warn-dim);
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .hidden { display: none !important; }
  .summary-row { display: flex; gap: 10px; margin-bottom: 4px; }
  .summary-box {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    border-radius: 8px;
  }
  .summary-box .num { font-size: 24px; font-weight: 700; }
  .summary-box .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .summary-box.total { background: var(--accent-dim); }
  .summary-box.total .num { color: var(--accent); }
  .summary-box.overdue { background: var(--danger-dim); }
  .summary-box.overdue .num { color: var(--danger); }
  .issue-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .issue-card.overdue { border-color: var(--danger); background: var(--danger-dim); }
  .issue-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .issue-place { font-size: 12px; color: var(--muted); font-weight: 600; }
  .issue-due { font-size: 12px; font-weight: 600; }
  .issue-due.overdue { color: var(--danger); }
  .issue-text { font-size: 14px; margin: 6px 0; }
  .issue-problem { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .issue-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  button.fix-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.fix-btn:disabled { background: #a9b3a3; cursor: not-allowed; }
  .empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 0; }
  footer {
    max-width: 720px;
    margin: 24px auto 0;
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<header><h1>ติดตามการแก้ไข 5ส</h1></header>

<main>

  <div id="config-warning" class="config-warning hidden">
    ยังไม่ได้ใส่ SUPABASE_URL และ SUPABASE_ANON_KEY — แก้ค่าสองตัวนี้ในสคริปต์ด้านล่างของไฟล์ก่อนใช้งานจริง
  </div>

  <div class="card">
    <h2>กรองตามแผนก (ไม่เลือก = ดูทุกแผนก)</h2>
    <label for="dept-select">แผนก</label>
    <select id="dept-select"><option value="">— ทุกแผนก —</option></select>
  </div>

  <div class="card">
    <div class="summary-row">
      <div class="summary-box total">
        <div class="num" id="total-count">–</div>
        <div class="label">รายการค้างอยู่</div>
      </div>
      <div class="summary-box overdue">
        <div class="num" id="overdue-count">–</div>
        <div class="label">เลยกำหนดแล้ว</div>
      </div>
    </div>
  </div>

  <div id="issue-list"><div class="empty-state">กำลังโหลด...</div></div>

</main>

<footer>แบบประเมินโครงการ 5 ส. | ใช้ภายในบริษัทเท่านั้น | พัฒนาโดย Sarawut.C</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// ตั้งค่าการเชื่อมต่อ — แก้สองค่านี้ก่อนใช้งานจริง (ค่าเดียวกับฟอร์มตรวจ)
// ============================================================
const SUPABASE_URL = "https://zsdcjutavrodcvkoolge.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzZGNqdXRhdnJvZGN2a29vbGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTUxOTksImV4cCI6MjEwMjkzMTE5OX0.zdgDFGwXZmUbfx7kYawi1fhm-vdCg_bILO9yFLED-eY";


const CONFIGURED = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
if (!CONFIGURED) document.getElementById("config-warning").classList.remove("hidden");

const supabaseClient = CONFIGURED
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const todayStr = new Date().toISOString().slice(0, 10);

// ------------------------------------------------------------
// โหลดรายชื่อแผนกสำหรับตัวกรอง
// ------------------------------------------------------------
async function loadDepartments() {
  if (!supabaseClient) return;
  const { data, error } = await supabaseClient
    .from("departments")
    .select("id, name")
    .order("name");
  if (error) { console.error(error); return; }
  const sel = document.getElementById("dept-select");
  data.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.textContent = d.name;
    sel.appendChild(opt);
  });
}
loadDepartments();

document.getElementById("dept-select").addEventListener("change", loadIssues);
loadIssues();

// ------------------------------------------------------------
// โหลดรายการที่ยังค้างแก้ไข (fix_completed_date เป็น null)
// ------------------------------------------------------------
async function loadIssues() {
  if (!supabaseClient) return;
  const listEl = document.getElementById("issue-list");
  listEl.innerHTML = `<div class="empty-state">กำลังโหลด...</div>`;

  const deptId = document.getElementById("dept-select").value;

  let query = supabaseClient
    .from("audit_scores")
    .select(`
      id, score, problem_detail, fix_due_date, responsible_id,
      checklist_items ( item_no, item_text ),
      audits ( audit_date, sub_area_id, sub_areas ( name, department_id, departments ( name ) ) ),
      employees ( full_name )
    `)
    .is("fix_completed_date", null)
    .not("problem_detail", "is", null)
    .order("fix_due_date", { ascending: true, nullsFirst: false });

  const { data, error } = await query;
  if (error) { listEl.innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${error.message}</div>`; return; }

  // กรองตามแผนกฝั่ง client (เพราะ nested filter ข้ามหลายชั้นทำใน query ตรงๆ ยาก)
  const filtered = deptId
    ? data.filter(row => row.audits?.sub_areas?.department_id === deptId)
    : data;

  const overdueCount = filtered.filter(r => r.fix_due_date && r.fix_due_date < todayStr).length;
  document.getElementById("total-count").textContent = filtered.length;
  document.getElementById("overdue-count").textContent = overdueCount;

  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty-state">ไม่มีรายการค้างแก้ไข 🎉</div>`;
    return;
  }

  listEl.innerHTML = "";
  filtered.forEach(row => {
    const isOverdue = row.fix_due_date && row.fix_due_date < todayStr;
    const deptName = row.audits?.sub_areas?.departments?.name || "-";
    const zoneName = row.audits?.sub_areas?.name || "-";
    const itemNo = row.checklist_items?.item_no ?? "-";
    const itemText = row.checklist_items?.item_text || "-";
    const responsibleName = row.employees?.full_name || "ยังไม่ระบุผู้รับผิดชอบ";

    const card = document.createElement("div");
    card.className = "issue-card" + (isOverdue ? " overdue" : "");
    card.innerHTML = `
      <div class="issue-head">
        <span class="issue-place">${deptName} / ${zoneName} — ข้อ ${itemNo}</span>
        <span class="issue-due ${isOverdue ? "overdue" : ""}">
          ${row.fix_due_date ? "กำหนดแก้ไข: " + row.fix_due_date + (isOverdue ? " (เลยกำหนด)" : "") : "ไม่ได้กำหนดวันแก้ไข"}
        </span>
      </div>
      <div class="issue-text">${itemText}</div>
      <div class="issue-problem">ปัญหา: ${row.problem_detail}</div>
      <div class="issue-meta">พบเมื่อ ${row.audits?.audit_date || "-"} | คะแนนที่ได้ ${row.score} | ผู้รับผิดชอบ: ${responsibleName}</div>
      <button class="fix-btn" data-id="${row.id}">✓ แก้ไขเสร็จแล้ว</button>
    `;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll(".fix-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "กำลังบันทึก...";
      const { error } = await supabaseClient
        .from("audit_scores")
        .update({ fix_completed_date: todayStr })
        .eq("id", btn.dataset.id);
      if (error) {
        alert("บันทึกไม่สำเร็จ: " + error.message);
        btn.disabled = false;
        btn.textContent = "✓ แก้ไขเสร็จแล้ว";
        return;
      }
      loadIssues(); // โหลดรายการใหม่ รายการนี้จะหายไปจากลิสต์
    });
  });
}
</script>
<script src="shared-nav.js"></script>
</body>
</html>
