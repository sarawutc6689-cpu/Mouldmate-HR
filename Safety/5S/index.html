<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบตรวจ 5ส</title>
<style>
  :root {
    --ink: #23281f;
    --muted: #6b7263;
    --line: #d9dccf;
    --paper: #fbfaf5;
    --card: #ffffff;
    --accent: #3d6b3f;
    --accent-dim: #e7efe4;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Sarabun", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 16px 16px;
    text-align: center;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    flex: 1;
    width: 100%;
  }
  a.menu-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
  }
  a.menu-card:active { border-color: var(--accent); }
  .menu-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .menu-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .menu-desc { font-size: 13px; color: var(--muted); margin: 0; }
  .menu-arrow { margin-left: auto; color: var(--muted); font-size: 18px; }
  footer {
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <h1>ระบบตรวจ 5ส</h1>
  <p>เลือกเมนูที่ต้องการใช้งาน</p>
</header>

<main>

  <a class="menu-card" href="audit.html">
    <div class="menu-icon">📋</div>
    <div>
      <p class="menu-title">ตรวจ 5ส</p>
      <p class="menu-desc">กรอกฟอร์มตรวจประจำสัปดาห์</p>
    </div>
    <span class="menu-arrow">›</span>
  </a>

  <a class="menu-card" href="5s_dashboard.html">
    <div class="menu-icon">📊</div>
    <div>
      <p class="menu-title">รายงานผลตรวจ</p>
      <p class="menu-desc">ดูแนวโน้มคะแนนและเทียบผลย้อนหลัง</p>
    </div>
    <span class="menu-arrow">›</span>
  </a>

  <a class="menu-card" href="5s_followup.html">
    <div class="menu-icon">✅</div>
    <div>
      <p class="menu-title">ติดตามการแก้ไข</p>
      <p class="menu-desc">ดูรายการค้างแก้ไขและปิดงาน</p>
    </div>
    <span class="menu-arrow">›</span>
  </a>

</main>

<footer>แบบประเมินโครงการ 5 ส. | ใช้ภายในบริษัทเท่านั้น | พัฒนาโดย Sarawut.C</footer>

<script src="shared-nav.js"></script>
</body>
</html>
