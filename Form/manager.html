
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ผู้จัดการฝ่าย – อนุมัติคำขอหนังสือรับรอง</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d0d5dd;--pri:#1f5fbf;--ok:#067647;--err:#b42318;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mut:#9aa3b2;--bd:#3a414d;--pri:#6ea2f5;--ok:#47cd89;--err:#f97066;--warn:#fdb022}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
input{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--pri)}
button.no{background:var(--err);border-color:var(--err)}
button.go{background:var(--ok);border-color:var(--ok)}
button:disabled{opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip.on{background:var(--pri);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.85rem;border:1px solid currentColor}
.mgr_pending{color:var(--warn)}.pending,.approved{color:var(--pri)}.mgr_rejected,.rejected{color:var(--err)}.done{color:var(--ok)}
.mut{color:var(--mut);font-size:.9rem}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hide{display:none}
#err{color:var(--err);min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <h2>ผู้จัดการฝ่าย – อนุมัติคำขอหนังสือรับรอง</h2>

  <div id="login" class="card" style="max-width:380px">
    <p><input id="em" type="text" placeholder="อีเมลผู้จัดการ" autocomplete="username"></p>
    <p><input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"></p>
    <button id="loginBtn">เข้าสู่ระบบ</button>
    <div id="err"></div>
  </div>

  <div id="app" class="hide">
    <div class="top"><span class="mut" id="who"></span><button class="sec" id="out">ออกจากระบบ</button></div>
    <div class="bar">
      <button class="sec chip on" data-s="wait" id="cWait">รอพิจารณา</button>
      <button class="sec chip" data-s="all">ทั้งหมดของฝ่าย</button>
      <button class="sec" id="reload">รีเฟรช</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ppzdyvomrfiitahxwrwz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const ST = {mgr_pending:"รอผู้จัดการอนุมัติ",mgr_rejected:"ผู้จัดการไม่อนุมัติ",pending:"ส่งต่อ HR แล้ว",approved:"HR อนุมัติแล้ว",rejected:"HR ไม่อนุมัติ",done:"ออกเอกสารแล้ว"};
const CT = {work:"หนังสือรับรองการทำงาน",salary:"หนังสือรับรองเงินเดือน",pass:"หนังสือผ่านงาน",slip:"สลิปเงินเดือน"};
const MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const d = s => { if(!s) return "-"; const x=new Date(typeof s==="string"&&s.length===10?s+"T00:00:00":s); return isNaN(x)?s:`${x.getDate()} ${MONTHS[x.getMonth()]} ${x.getFullYear()+543}`; };
let rows=[], tab="wait";

async function show(session){
  $("login").classList.toggle("hide",!!session);
  $("app").classList.toggle("hide",!session);
  if(!session) return;
  const {data}=await db.from("managers").select("division_name,division_code");
  $("who").textContent = session.user.email + (data&&data.length ? " · ฝ่าย: "+data.map(m=>m.division_name||m.division_code).join(", ") : " · (ยังไม่ได้ผูกกับฝ่ายใด)");
  load();
}
async function load(){
  const {data,error}=await db.from("certificate_requests").select("*").order("created_at",{ascending:false}).limit(300);
  if(error){ $("list").innerHTML=`<p class="mut">โหลดไม่สำเร็จ: ${esc(error.message)}</p>`; return; }
  rows=data; render();
}
function render(){
  const wait=rows.filter(r=>r.status==="mgr_pending").length;
  $("cWait").textContent=`รอพิจารณา (${wait})`;
  const rs=tab==="wait"?rows.filter(r=>r.status==="mgr_pending"):rows;
  $("list").innerHTML = rs.map(r=>`
    <div class="card">
      <div class="top"><b>${esc(r.emp_code)} ${esc(r.full_name)}</b><span class="tag ${r.status}">${ST[r.status]||r.status}</span></div>
      <div class="mut">${esc(r.position)} · ${esc(r.department)} · ${esc(r.division)} · เริ่มงาน ${d(r.start_date)}</div>
      <div>ประเภท: ${(r.cert_types||[]).map(c=>CT[c]||c).join(", ")}${r.slip_from?` (${esc(r.slip_from)} – ${esc(r.slip_to)})`:""}</div>
      <div>ใช้เพื่อ: ${esc(r.purpose)} · วันที่ใช้: ${d(r.use_date)}${(r.cert_types||[]).includes("salary")?` · ระบุเงินเดือน: ${r.show_salary?"ใช่":"ไม่"}`:""}</div>
      <div class="mut">ขอเมื่อ ${d(r.request_date)}${r.prev_requested?` · เคยขอ ${d(r.prev_date)}`:" · ไม่เคยขอ"}</div>
      ${r.mgr_decided_by?`<div class="mut">ตัดสินโดย ${esc(r.mgr_decided_by)} · ${d(r.mgr_decided_at)}${r.mgr_reject_reason?` · เหตุผล: ${esc(r.mgr_reject_reason)}`:""}</div>`:""}
      ${r.status==="mgr_pending"?`<div class="act"><button class="go" data-a="pending" data-id="${r.id}">อนุมัติ (ส่งต่อ HR)</button><button class="no" data-a="mgr_rejected" data-id="${r.id}">ไม่อนุมัติ</button></div>`:""}
    </div>`).join("") || `<p class="mut">${tab==="wait"?"ไม่มีคำขอที่รอพิจารณา":"ยังไม่มีคำขอของฝ่ายนี้"}</p>`;
}
$("list").addEventListener("click", async e=>{
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const st=b.dataset.a; let reason=null;
  if(st==="mgr_rejected"){ reason=prompt("เหตุผลที่ไม่อนุมัติ:"); if(reason===null) return; }
  else if(!confirm("อนุมัติคำขอนี้และส่งต่อให้ HR?")) return;
  b.disabled=true;
  const {data,error}=await db.from("certificate_requests").update({status:st,mgr_reject_reason:reason}).eq("id",b.dataset.id).eq("status","mgr_pending").select("id");
  if(error||!data||!data.length){ alert("ดำเนินการไม่สำเร็จ"+(error?": "+error.message:" (คำขอนี้อาจถูกดำเนินการไปแล้ว หรือไม่ใช่ฝ่ายของคุณ)")); b.disabled=false; return load(); }
  load();
});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); c.classList.add("on"); tab=c.dataset.s; render(); });
$("reload").onclick=load;
$("out").onclick=async()=>{ await db.auth.signOut(); show(null); };
$("loginBtn").onclick=async()=>{
  $("err").textContent="";
  const {data,error}=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error) return $("err").textContent="เข้าสู่ระบบไม่สำเร็จ: "+error.message;
  show(data.session);
};
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
db.auth.getSession().then(({data})=>show(data.session));
</script>
</body>
</html>
