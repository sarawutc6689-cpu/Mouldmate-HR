<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบขอหนังสือรับรอง</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d0d5dd;--pri:#1f5fbf;--ok:#067647;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mut:#9aa3b2;--bd:#3a414d;--pri:#6ea2f5;--ok:#47cd89;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
h1{text-align:center;font-size:1.5rem;margin:8px 0 16px}
h2{font-size:1.05rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.9rem;color:var(--mut);margin-bottom:2px}
input[type=text],input[type=date],input[type=month],select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
input[readonly]{background:var(--bg)}
.opt{display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--tx);font-size:1rem}
.opt input{margin-top:6px}
.row{display:flex;gap:8px;align-items:end}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--pri)}
button:disabled{opacity:.5}
#msg{margin:8px 0;min-height:1.4em}
.ok{color:var(--ok)}.err{color:var(--err)}
.note{font-size:.85rem;color:var(--mut)}
.hide{display:none}
#print{display:none}
@media print{
  body{background:#fff;color:#000}.wrap>*:not(#print){display:none!important}
  #print{display:block;font-size:14pt;line-height:1.9}
  #print .u{border-bottom:1px dotted #000;padding:0 6px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>แบบขอหนังสือรับรอง</h1>

  <form id="f" class="card" autocomplete="off">
    <h2>ข้อมูลพนักงาน</h2>
    <div class="grid">
      <div><label for="emp_code">รหัสพนักงาน</label>
        <div class="row"><input type="text" id="emp_code" required><button type="button" class="sec" id="lookup">ค้นหา</button></div></div>
      <div><label for="request_date">วันที่ขอ</label><input type="date" id="request_date" required></div>
      <div class="full"><label for="full_name">ชื่อ - นามสกุล</label><input type="text" id="full_name" readonly></div>
      <div><label for="start_date">วันเริ่มงาน</label><input type="text" id="start_date" readonly></div>
      <div><label for="position">ตำแหน่ง</label><input type="text" id="position" readonly></div>
      <div><label for="department">แผนก</label><input type="text" id="department" readonly></div>
      <div><label for="division">ฝ่าย</label><input type="text" id="division" readonly></div>
    </div>
    <div id="msg"></div>

    <h2 style="margin-top:16px">ประเภทหนังสือรับรอง (เลือกได้มากกว่า 1)</h2>
    <label class="opt"><input type="checkbox" name="cert" value="work"> หนังสือรับรองการทำงาน (ยังมีสภาพเป็นพนักงาน)</label>
    <label class="opt"><input type="checkbox" name="cert" value="salary"> หนังสือรับรองเงินเดือน (ยังมีสภาพเป็นพนักงาน)</label>
    <label class="opt"><input type="checkbox" name="cert" value="pass"> หนังสือผ่านงาน (พ้นสภาพพนักงานแล้ว)</label>
    <label class="opt"><input type="checkbox" name="cert" value="slip" id="slipChk"> สลิปเงินเดือน</label>
    <div class="grid hide" id="slipBox">
      <div><label for="slip_from">ตั้งแต่เดือน</label><input type="month" id="slip_from"></div>
      <div><label for="slip_to">ถึงเดือน</label><input type="month" id="slip_to"></div>
    </div>

    <h2 style="margin-top:16px">ประวัติการขอออกหนังสือรับรอง</h2>
    <label class="opt"><input type="radio" name="prev" value="never" checked> ไม่เคย</label>
    <label class="opt"><input type="radio" name="prev" value="ever"> เคย</label>
    <div class="grid hide" id="prevBox">
      <div><label for="prev_date">เมื่อวันที่</label><input type="date" id="prev_date"></div>
      <div><label for="prev_purpose">เพื่อนำไปใช้เรื่อง</label><input type="text" id="prev_purpose"></div>
    </div>

    <h2 style="margin-top:16px">รายละเอียดเกี่ยวกับรายได้</h2>
    <label class="opt"><input type="radio" name="salary" value="show"> ให้ระบุเงินเดือนในหนังสือรับรอง</label>
    <label class="opt"><input type="radio" name="salary" value="hide" checked> ไม่ต้องระบุ</label>

    <h2 style="margin-top:16px">การนำไปใช้</h2>
    <div class="grid">
      <div><label for="purpose">ต้องการนำไปใช้สำหรับ</label><input type="text" id="purpose" required></div>
      <div><label for="use_date">เพื่อใช้ในวันที่</label><div class="note" id="useHint"></div><input type="date" id="use_date" required></div>
    </div>
    <p class="note">หมายเหตุ: บริษัทไม่ออกหนังสือรับรองที่มีข้อความอันเป็นเท็จ และควรขอล่วงหน้าอย่างน้อย 3 วัน / สลิปเงินเดือนฉบับละ 5 บาท เรียกเก็บในงวดเงินเดือนที่ขอ</p>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button type="submit" id="submitBtn">ส่งคำขอ</button>
      <button type="button" class="sec" id="printBtn">พิมพ์แบบฟอร์ม</button>
    </div>
  </form>
</div>

<div id="print"></div>

<script>
/* ===== ตั้งค่า: ใส่ anon (public) key ของโปรเจกต์ Supabase ===== */
const SUPABASE_URL = "https://ppzdyvomrfiitahxwrwz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";
/* ================================================================ */

/* สถานะที่ถือว่า "พ้นสภาพพนักงานแล้ว" (ให้ตรงกับค่าจริงในคอลัมน์ status ของ employees_directory) */
const RESIGNED_STATUS = ["resigned","terminated","inactive","ลาออก","พ้นสภาพ","ออกแล้ว"];
let empStatus = null;

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const CERT = {work:"หนังสือรับรองการทำงาน",salary:"หนังสือรับรองเงินเดือน",pass:"หนังสือผ่านงาน",slip:"สลิปเงินเดือน"};

const thDate = s => { if(!s) return ""; const d=new Date(s); return isNaN(d)?s:`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543}`; };
const thMonth = s => { if(!s) return ""; const [y,m]=s.split("-"); return `${MONTHS[+m-1]} ${+y+543}`; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg = (t,c) => { $("msg").className=c||""; $("msg").textContent=t; };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
let HOLIDAYS = {};   // { "YYYY-MM-DD": "ชื่อวันหยุด" } โหลดจากตาราง holidays
const isOff = s => new Date(s+"T00:00:00").getDay()===0 || s in HOLIDAYS;
/* วันที่เร็วที่สุดที่ใช้ได้ = วันถัดจาก "3 วันทำการ" นับจากวันนี้ (เว้นวันอาทิตย์และวันหยุดในตาราง holidays) */
function earliestUseDate(){
  const d=new Date(); let n=0;
  while(n<3){ d.setDate(d.getDate()+1); if(!isOff(iso(d))) n++; }
  do { d.setDate(d.getDate()+1); } while(isOff(iso(d)));
  return iso(d);
}
let MIN_USE = earliestUseDate();
$("request_date").value = iso(new Date());
function refreshMin(){
  MIN_USE = earliestUseDate();
  $("use_date").min = MIN_USE;
  $("useHint").textContent = `เลือกได้ตั้งแต่วันที่ ${thDate(MIN_USE)} เป็นต้นไป`;
  const v=$("use_date").value; if(v && (v<MIN_USE || isOff(v))) $("use_date").value="";
}
refreshMin();
db.from("holidays").select("holiday_date,name").gte("holiday_date",iso(new Date())).then(({data,error})=>{
  if(error||!data) return;   // อ่านวันหยุดไม่ได้ → ใช้เฉพาะกฎวันอาทิตย์
  HOLIDAYS = Object.fromEntries(data.map(h=>[h.holiday_date,h.name]));
  refreshMin();
});
$("use_date").addEventListener("change",()=>{
  const v=$("use_date").value;
  if(v && (v<MIN_USE || isOff(v))){ msg(v<MIN_USE?`วันที่ใช้ต้องเป็นวันที่ ${thDate(MIN_USE)} เป็นต้นไป`:(v in HOLIDAYS?`${thDate(v)} เป็นวันหยุด (${HOLIDAYS[v]})`:"ไม่สามารถเลือกวันอาทิตย์ได้"),"err"); $("use_date").value=""; }
});
$("slipChk").onchange = e => $("slipBox").classList.toggle("hide",!e.target.checked);
document.querySelectorAll("[name=prev]").forEach(r => r.onchange = () =>
  $("prevBox").classList.toggle("hide", document.querySelector("[name=prev]:checked").value!=="ever"));

function applyStatus(status){
  empStatus = status||null;
  const gone = !!status && RESIGNED_STATUS.includes(String(status).trim().toLowerCase());
  document.querySelectorAll("[name=cert]").forEach(c=>{
    const allowed = !status ? true : gone ? c.value==="pass" : c.value!=="pass";
    c.disabled = !allowed;
    if(!allowed) c.checked=false;
    if(gone && c.value==="pass") c.checked=true;
  });
  $("slipBox").classList.toggle("hide", !$("slipChk").checked);
  return gone;
}
async function lookup(){
  const code = $("emp_code").value.trim();
  if(!code) return msg("กรุณากรอกรหัสพนักงาน","err");
  msg("กำลังค้นหา...");
  const {data,error} = await db.rpc("get_employee",{p_code:code});
  if(error) return msg("เกิดข้อผิดพลาด: "+error.message,"err");
  const e = Array.isArray(data)?data[0]:data;
  if(!e){ ["full_name","start_date","position","department","division"].forEach(k=>$(k).value=""); applyStatus(null); return msg("ไม่พบรหัสพนักงานนี้","err"); }
  $("full_name").value = e.full_name||"";
  $("start_date").value = e.start_date||"";
  $("position").value = e.position||"";
  $("department").value = e.department||"";
  $("division").value = e.division||"";
  const gone = applyStatus(e.status);
  msg(gone ? "พบข้อมูลพนักงาน (พ้นสภาพแล้ว – ขอได้เฉพาะหนังสือผ่านงาน)" : "พบข้อมูลพนักงาน (ปัจจุบัน – ขอหนังสือรับรองการทำงาน/เงินเดือน/สลิปได้)","ok");
}
$("lookup").onclick = lookup;
$("emp_code").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();lookup();} });

function collect(){
  const certs=[...document.querySelectorAll("[name=cert]:checked")].map(c=>c.value);
  const ever=document.querySelector("[name=prev]:checked").value==="ever";
  return {
    request_date:$("request_date").value, emp_code:$("emp_code").value.trim(),
    full_name:$("full_name").value, start_date:$("start_date").value||null,
    position:$("position").value, department:$("department").value, division:$("division").value,
    emp_status:empStatus, cert_types:certs,
    slip_from:certs.includes("slip")?($("slip_from").value||null):null,
    slip_to:certs.includes("slip")?($("slip_to").value||null):null,
    prev_requested:ever, prev_date:ever?($("prev_date").value||null):null,
    prev_purpose:ever?$("prev_purpose").value:null,
    show_salary:document.querySelector("[name=salary]:checked").value==="show",
    purpose:$("purpose").value, use_date:$("use_date").value||null
  };
}

$("f").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!$("full_name").value) return msg("กรุณาค้นหารหัสพนักงานก่อนส่ง","err");
  const r = collect();
  if(!r.use_date || r.use_date<MIN_USE || isOff(r.use_date)) return msg(`กรุณาเลือกวันที่ใช้ตั้งแต่ ${thDate(MIN_USE)} เป็นต้นไป (ไม่ใช่วันอาทิตย์/วันหยุด)`,"err");
  if(!r.cert_types.length) return msg("กรุณาเลือกประเภทหนังสือรับรองอย่างน้อย 1 รายการ","err");
  $("submitBtn").disabled=true; msg("กำลังบันทึก...");
  const {error} = await db.from("certificate_requests").insert(r);
  if(error){ $("submitBtn").disabled=false; return msg("บันทึกไม่สำเร็จ: "+error.message,"err"); }
  msg("ส่งคำขอเรียบร้อยแล้ว กำลังรีโหลดหน้า...","ok");
  setTimeout(()=>location.reload(),1500);
});

$("printBtn").onclick = () => {
  const r = collect(), u = v => `<span class="u">${esc(v)||"&nbsp;".repeat(12)}</span>`;
  const box = on => on?"[ ✓ ]":"[&nbsp;&nbsp;&nbsp;]";
  const has = k => r.cert_types.includes(k);
  $("print").innerHTML = `
    <h2 style="text-align:center">แบบขอหนังสือรับรอง</h2>
    <p>วันที่ ${u(thDate(r.request_date))}</p>
    <p>รหัส ${u(r.emp_code)} ชื่อ - นามสกุล ${u(r.full_name)} วันเริ่มงาน ${u(thDate(r.start_date))} ตำแหน่ง ${u(r.position)}<br>
       แผนก ${u(r.department)} ฝ่าย ${u(r.division)} ต้องการขอให้บริษัทออกหนังสือรับรองประเภท</p>
    <p>${box(has("work"))} ${CERT.work} (ยังมีสภาพเป็นพนักงาน)<br>
       ${box(has("salary"))} ${CERT.salary} (ยังมีสภาพเป็นพนักงาน)<br>
       ${box(has("pass"))} ${CERT.pass} (พ้นสภาพพนักงานแล้ว)<br>
       ${box(has("slip"))} ${CERT.slip} ตั้งแต่เดือน ${u(thMonth(r.slip_from))} ถึง ${u(thMonth(r.slip_to))}</p>
    <p>ประวัติการขอออกหนังสือรับรอง : ${box(r.prev_requested)} เคย เมื่อวันที่ ${u(thDate(r.prev_date))} เพื่อนำไปใช้เรื่อง ${u(r.prev_purpose)}
       &nbsp; ${box(!r.prev_requested)} ไม่เคย</p>
    <p>รายละเอียดเกี่ยวกับรายได้: ${box(r.show_salary)} ให้ระบุเงินเดือน &nbsp; ${box(!r.show_salary)} ไม่ต้องระบุ</p>
    <p>ต้องการนำไปใช้สำหรับ ${u(r.purpose)} เพื่อใช้ในวันที่ ${u(thDate(r.use_date))}</p>
    <p style="text-align:right;margin-top:40px">ลงชื่อ ................................................ พนักงาน (ตัวบรรจง)</p>
    <p style="font-size:11pt">หมายเหตุ 1. บริษัทไม่มีนโยบายออกหนังสือรับรองใด ๆ ที่มีข้อความอันเป็นเท็จ และควรขอล่วงหน้าอย่างน้อย 3 วัน<br>
       2. สลิปเงินเดือนมีค่าใช้จ่ายฉบับละ 5 บาท โดยจะเรียกเก็บในงวดเงินเดือนที่ขอ</p>
    <p>ความเห็นของหัวหน้าแผนก : ........................................ ลงชื่อ ............................ วันที่ ....../....../......<br>
       ความเห็นของผู้จัดการฝ่าย : ........................................ ลงชื่อ ............................ วันที่ ....../....../......</p>
    <p>ความเห็นฝ่ายบุคคลและธุรการ: [&nbsp;&nbsp;&nbsp;] อนุมัติ &nbsp; [&nbsp;&nbsp;&nbsp;] ไม่อนุมัติ เนื่องจาก ......................................<br>
       ลงชื่อ ........................................... ว.ด.ป. ...........</p>`;
  window.print();
};
</script>
</body>
</html>
