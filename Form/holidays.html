<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HR – จัดการวันหยุด</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d0d5dd;--pri:#1f5fbf;--ok:#067647;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mut:#9aa3b2;--bd:#3a414d;--pri:#6ea2f5;--ok:#47cd89;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--pri)}
button.no{background:transparent;color:var(--err);border-color:var(--err);padding:3px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:160px}
label{display:block;font-size:.9rem;color:var(--mut)}
table{width:100%;border-collapse:collapse}
td{padding:7px 4px;border-bottom:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:.9rem}
.hide{display:none}
#err,#msg{min-height:1.4em}#err,.bad{color:var(--err)}.good{color:var(--ok)}
a{color:var(--pri)}
</style>
</head>
<body>
<div class="wrap">
  <h2>HR – จัดการวันหยุด</h2>

  <div id="login" class="card" style="max-width:380px">
    <p><input id="em" type="text" placeholder="อีเมล HR" autocomplete="username"></p>
    <p><input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"></p>
    <button id="loginBtn">เข้าสู่ระบบ</button>
    <div id="err"></div>
  </div>

  <div id="app" class="hide">
    <div class="top"><a href="admin.html">← กลับหน้าคำขอ</a><span><span class="mut" id="who"></span> <button class="sec" id="out">ออกจากระบบ</button></span></div>

    <div class="card" style="margin-top:12px">
      <b>เพิ่มวันหยุดทีละวัน</b>
      <div class="row" style="margin-top:8px">
        <div><label for="hd">วันที่</label><input type="date" id="hd"></div>
        <div style="flex:2"><label for="hn">ชื่อวันหยุด</label><input type="text" id="hn" placeholder="เช่น วันปิยมหาราช"></div>
        <div style="flex:0"><button id="add">เพิ่ม</button></div>
      </div>
    </div>

    <div class="card">
      <b>เพิ่มหลายวันพร้อมกัน</b>
      <p class="mut" style="margin:4px 0">บรรทัดละ 1 วัน รูปแบบ <code>ปี-เดือน-วัน ชื่อวันหยุด</code> (ใช้ ค.ศ. หรือ พ.ศ. ก็ได้) วันที่ซ้ำจะถูกอัปเดตชื่อ</p>
      <textarea id="bulk" rows="5" placeholder="2026-12-31 วันสิ้นปี&#10;2569-12-10 วันรัฐธรรมนูญ"></textarea>
      <p><button class="sec" id="addBulk">เพิ่มทั้งหมด</button></p>
    </div>

    <div id="msg"></div>

    <div class="card">
      <div class="row"><div><label for="yr">ปี (พ.ศ.)</label><select id="yr"></select></div></div>
      <table id="tbl"></table>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ppzdyvomrfiitahxwrwz.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwemR5dm9tcmZpaXRhaHh3cnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjQ0MjIsImV4cCI6MjEwNDYwMDQyMn0.iArUz6swMfwhFT_1qEvCwK1B3aiCxdWt46_FBjT6_Y0";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const th = s => { const d=new Date(s+"T00:00:00"); return `วัน${DAYS[d.getDay()]}ที่ ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543}`; };
const msg = (t,c) => { $("msg").className=c||""; $("msg").textContent=t; };
const valid = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s+"T00:00:00"));

const now = new Date().getFullYear();
for(let y=now-1;y<=now+2;y++) $("yr").add(new Option(y+543,y,false,y===now));

function show(session){
  $("login").classList.toggle("hide",!!session);
  $("app").classList.toggle("hide",!session);
  if(session){ $("who").textContent=session.user.email; load(); }
}
async function load(){
  const y=+$("yr").value;
  const {data,error}=await db.from("holidays").select("*").gte("holiday_date",`${y}-01-01`).lte("holiday_date",`${y}-12-31`).order("holiday_date");
  if(error) return $("tbl").innerHTML=`<tr><td class="bad">โหลดไม่สำเร็จ: ${esc(error.message)}</td></tr>`;
  $("tbl").innerHTML = data.length ? data.map(h=>`<tr><td>${th(h.holiday_date)}</td><td>${esc(h.name)}</td>
    <td style="text-align:right"><button class="no" data-d="${h.holiday_date}">ลบ</button></td></tr>`).join("")
    : '<tr><td class="mut">ยังไม่มีวันหยุดในปีนี้</td></tr>';
}
$("yr").onchange=load;

async function upsert(rows){
  const {error}=await db.from("holidays").upsert(rows,{onConflict:"holiday_date"});
  if(error) return msg("บันทึกไม่สำเร็จ: "+error.message,"bad");
  msg(`บันทึก ${rows.length} รายการแล้ว`,"good"); load();
}
$("add").onclick=()=>{
  const d=$("hd").value,n=$("hn").value.trim();
  if(!d||!n) return msg("กรุณากรอกวันที่และชื่อวันหยุด","bad");
  upsert([{holiday_date:d,name:n}]).then(()=>{$("hn").value="";});
};
$("addBulk").onclick=()=>{
  const rows=[],bad=[];
  $("bulk").value.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^(\d{4})-(\d{2})-(\d{2})\s+(.+)$/);
    if(!m) return bad.push(l);
    let y=+m[1]; if(y>2400) y-=543;
    const ds=`${y}-${m[2]}-${m[3]}`;
    valid(ds)?rows.push({holiday_date:ds,name:m[4].trim()}):bad.push(l);
  });
  if(bad.length) return msg("รูปแบบไม่ถูกต้อง: "+bad.join(" | "),"bad");
  if(!rows.length) return msg("ยังไม่มีข้อมูล","bad");
  upsert(rows).then(()=>{$("bulk").value="";});
};
$("tbl").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-d]"); if(!b||!confirm("ลบวันหยุดนี้?")) return;
  const {error}=await db.from("holidays").delete().eq("holiday_date",b.dataset.d);
  if(error) return msg("ลบไม่สำเร็จ: "+error.message,"bad");
  msg("ลบแล้ว","good"); load();
});

$("out").onclick=async()=>{ await db.auth.signOut(); show(null); };
$("loginBtn").onclick=async()=>{
  $("err").textContent="";
  const {data,error}=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error) return $("err").textContent="เข้าสู่ระบบไม่สำเร็จ: "+error.message;
  show(data.session);
};
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
db.auth.getSession().then(({data})=>show(data.session));
</script>
</body>
</html>
